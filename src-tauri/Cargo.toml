[package]
name = "tmd"
version = "0.2.0-spike.1"
description = "TMD - Type Markdown, Done.（Tauri spike 壳层）"
authors = ["chiangyang"]
edition = "2021"
rust-version = "1.77.2"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api"] }
tauri-plugin-dialog = "2"
tauri-plugin-single-instance = "2"
# 自动更新原语（签名校验 / 下载 / 安装）；端点与公钥见 tauri.conf.json plugins.updater
tauri-plugin-updater = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
encoding_rs = "0.8"
regex = "1"
path-clean = "1"
pinyin = "0.10"
notify = "7"
sha1 = "0.10"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
dirs = "6"
url = "2"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "native-tls"] }
tokio = { version = "1", features = ["time", "macros", "sync"] }
tokio-util = "0.7"
futures-util = "0.3"
keyring = { version = "3", features = ["apple-native", "windows-native"] }
base64 = "0.22"
opener = { version = "0.7", features = ["reveal"] }
trash = "5"

# 导出链平台原语（export_native.rs）：objc2 直调 WKWebView，
# 仅 macOS 参与编译——Windows 走 exporter_stub.rs（见 main.rs 模块声明）
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3.2", features = ["NSBitmapImageRep", "NSImage"] }
objc2-core-foundation = "0.3"
objc2-foundation = { version = "0.3.2", features = ["NSData", "NSError", "NSString"] }
objc2-web-kit = { version = "0.3.2", features = ["WKPDFConfiguration", "WKSnapshotConfiguration", "block2", "WKWebView"] }
block2 = "0.6"

# 导出链平台原语（export_native.rs / export_native_win.rs）：WebView2 直调，
# webview2-com 与 wry 内部同版本（共享 ICoreWebView2 类型，避免 windows 多版本）；
# png 用于区域截帧裁剪（CapturePreview 无 rect 参数）
[target.'cfg(windows)'.dependencies]
webview2-com = "0.39"
windows = { version = "0.62", features = ["Win32_System_Com", "Win32_System_Com_StructuredStorage"] }
png = "0.18"

[profile.dev]
incremental = true

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
