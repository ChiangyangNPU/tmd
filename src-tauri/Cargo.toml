[package]
name = "tmd"
version = "0.2.0-spike.1"
description = "TMD - Type Markdown, Done.（Tauri spike 壳层）"
authors = ["chiangyang"]
edition = "2021"
rust-version = "1.77.2"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
encoding_rs = "0.8"
regex = "1"
path-clean = "1"
notify = "7"
sha1 = "0.10"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
dirs = "6"
url = "2"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "native-tls"] }
tokio = { version = "1", features = ["time", "macros", "sync"] }
tokio-util = "0.7"
futures-util = "0.3"
keyring = { version = "3", features = ["apple-native", "windows-native"] }

[profile.dev]
incremental = true

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
