[package]
name = "tmd"
version = "0.2.0-spike.1"
description = "TMD - Type Markdown, Done.（Tauri spike 壳层）"
authors = ["chiangyang"]
edition = "2021"
rust-version = "1.77.2"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
encoding_rs = "0.8"
regex = "1"
path-clean = "1"
pinyin = "0.10"
objc2 = "0.6"
objc2-app-kit = { version = "0.3.2", features = ["NSBitmapImageRep", "NSImage"] }
objc2-core-foundation = "0.3"
objc2-foundation = { version = "0.3.2", features = ["NSData", "NSError", "NSString"] }
objc2-web-kit = { version = "0.3.2", features = ["WKPDFConfiguration", "WKSnapshotConfiguration", "block2", "WKWebView"] }
block2 = "0.6"
notify = "7"
sha1 = "0.10"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
dirs = "6"
url = "2"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "native-tls"] }
tokio = { version = "1", features = ["time", "macros", "sync"] }
tokio-util = "0.7"
futures-util = "0.3"
keyring = { version = "3", features = ["apple-native", "windows-native"] }
base64 = "0.22"
opener = { version = "0.7", features = ["reveal"] }
trash = "5"

[profile.dev]
incremental = true

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
