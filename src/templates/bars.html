<div id="find-bar" class="find-bar" hidden>
  <input
    id="find-input"
    class="find-input"
    data-i18n-placeholder="find.placeholder"
    placeholder="查找"
  />
  <button id="find-regex" class="tool-btn" data-i18n-title="find.regexTitle" aria-pressed="false">
    .*
  </button>
  <span id="find-count" class="find-count">0/0</span>
  <button id="find-prev" class="tool-btn" data-i18n="find.prev" data-i18n-title="find.prev">
    ↑
  </button>
  <button id="find-next" class="tool-btn" data-i18n="find.next" data-i18n-title="find.next">
    ↓
  </button>
  <input
    id="replace-input"
    class="find-input"
    data-i18n-placeholder="find.replacePlaceholder"
    placeholder="替换为"
  />
  <button id="replace-one" class="tool-btn" data-i18n="find.replace">替换</button>
  <button id="replace-all" class="tool-btn" data-i18n="find.replaceAll">全部</button>
  <button id="find-close" class="tool-btn" data-i18n-title="find.close">✕</button>
</div>

<div id="link-bar" class="find-bar" hidden>
  <input
    id="link-input"
    class="find-input link-input"
    data-i18n-placeholder="linkBar.placeholder"
    placeholder="输入链接地址，回车确认"
  />
  <button id="link-ok" class="tool-btn" data-i18n="linkBar.apply">应用</button>
  <button id="link-cancel" class="tool-btn" data-i18n="linkBar.cancel">取消</button>
</div>
