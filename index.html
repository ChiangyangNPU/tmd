<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TMD</title>
    <!-- 首帧引导：平台类 + 主题防闪，详见 public/boot.js -->
    <script src="./boot.js"></script>
  </head>
  <body>
    <!-- 单行顶栏（Mac/Windows 同构）：
         Mac 走 hiddenInset（红绿灯浮在左侧），功能按钮组靠右；
         Windows/Linux 走 hidden（自绘窗口按钮独占右缘），功能按钮组靠左且顺序反转；
         整行是拖拽区，文件名绝对居中 -->
    <header class="toolbar">
      <span id="win-title" class="win-title"></span>
      <div class="toolbar-left">
        <span id="word-count" class="word-count">0 字</span>
        <button
          id="sidebar-outline-btn"
          class="tool-btn"
          data-i18n="toolbar.outline"
          data-i18n-title="toolbar.outlineTitle"
        >
          大纲
        </button>
        <button
          id="source-mode-btn"
          class="tool-btn"
          data-i18n="toolbar.sourceMode"
          data-i18n-title="toolbar.sourceModeTitle"
        >
          源码
        </button>
        <button
          id="import-btn"
          class="tool-btn"
          data-i18n="toolbar.open"
          data-i18n-title="toolbar.openTitle"
        >
          打开
        </button>
        <button
          id="export-btn"
          class="tool-btn"
          data-i18n="toolbar.save"
          data-i18n-title="toolbar.saveTitle"
        >
          保存
        </button>
        <button id="more-btn" class="tool-btn" data-i18n-title="toolbar.more">⋯</button>
        <button id="theme-toggle" class="theme-toggle" data-i18n-title="toolbar.themeTitle">
          🌙
        </button>
      </div>
      <!-- Windows/Linux 自绘窗口控制：极简透明按钮（hover 高亮，关闭 hover 红） -->
      <div class="win-controls" aria-label="窗口控制">
        <button id="win-min" class="win-btn" tabindex="-1" aria-label="最小化">
          <svg width="10" height="10" viewBox="0 0 10 10" aria-hidden="true">
            <path d="M0 5h10" stroke="currentColor" stroke-width="1" />
          </svg>
        </button>
        <button id="win-max" class="win-btn" tabindex="-1" aria-label="最大化/还原">
          <svg class="ic-max" width="10" height="10" viewBox="0 0 10 10" aria-hidden="true">
            <rect x="0.5" y="0.5" width="9" height="9" fill="none" stroke="currentColor" />
          </svg>
          <svg class="ic-restore" width="10" height="10" viewBox="0 0 10 10" aria-hidden="true">
            <rect x="0.5" y="2.5" width="7" height="7" fill="none" stroke="currentColor" />
            <path d="M2.5 2.5v-2h7v7h-2" fill="none" stroke="currentColor" />
          </svg>
        </button>
        <button id="win-close" class="win-btn win-close" tabindex="-1" aria-label="关闭">
          <svg width="10" height="10" viewBox="0 0 10 10" aria-hidden="true">
            <path d="M0 0l10 10M10 0L0 10" stroke="currentColor" stroke-width="1" />
          </svg>
        </button>
      </div>
    </header>

    <template data-partial="menus"></template>

    <template data-partial="quick-switch"></template>

    <template data-partial="search"></template>

    <template data-partial="history"></template>

    <template data-partial="table-toolbar"></template>

    <template data-partial="settings"></template>

    <template data-partial="bars"></template>

    <div class="workbench">
      <aside id="sidebar" class="sidebar" hidden>
        <div id="outline-panel" class="sidebar-panel" hidden>
          <div class="sidebar-title" data-i18n="sidebar.outline">大纲</div>
          <div id="outline-list" class="outline-list"></div>
        </div>
        <div id="files-panel" class="sidebar-panel" hidden>
          <div class="sidebar-title">
            <span data-i18n="sidebar.files">文件</span>
            <button
              id="open-folder-btn"
              class="tool-btn small"
              data-i18n="toolbar.newFolder"
              title="打开文件夹"
            >
              ＋文件夹
            </button>
          </div>
          <div class="sidebar-subtitle sidebar-subtitle-row">
            <span data-i18n="sidebar.recent">最近打开</span>
            <button
              id="clear-recent-btn"
              type="button"
              class="subtitle-clear-btn"
              hidden
              data-i18n="files.clearRecent"
              data-i18n-title="files.clearRecentTitle"
            >
              清空
            </button>
          </div>
          <div id="recent-list" class="file-list"></div>
          <div class="sidebar-subtitle sidebar-subtitle-row">
            <span data-i18n="sidebar.folder">文件夹</span>
            <button
              id="clear-folder-btn"
              type="button"
              class="subtitle-clear-btn"
              hidden
              data-i18n="files.clearFolders"
              data-i18n-title="files.clearFoldersTitle"
            >
              清空
            </button>
          </div>
          <div id="folder-tree" class="file-list"></div>
        </div>
      </aside>

      <!-- 侧边栏分隔条：拖拽调整侧边栏与编辑区的宽度分配（随侧边栏显隐，样式层控制） -->
      <div
        id="sidebar-resizer"
        class="sidebar-resizer"
        role="separator"
        aria-orientation="vertical"
      ></div>

      <main class="content">
        <div id="tab-bar" class="tab-bar"></div>
        <div id="panes" class="panes">
          <div class="page-scroll">
            <div class="page">
              <div id="editor"></div>
            </div>
          </div>
          <div
            id="split-divider"
            class="split-divider"
            hidden
            role="separator"
            aria-orientation="vertical"
          ></div>
          <div id="src-pane" class="src-pane" hidden>
            <div id="src-editor"></div>
          </div>
        </div>
      </main>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
