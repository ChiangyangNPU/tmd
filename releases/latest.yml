releaseNotes: |
  ## [0.1.4] - 2026-10-18

  ### 新增

  - **支持打开 .txt 文件**：打开对话框 / 文件树 / 拖拽进窗口 / 启动参数全链路放行 txt（`electron/main.cjs` 打开对话框拆出 `OPEN_FILTERS`，`readDir` 与单实例 argv 过滤同步加 txt；`src/dragdrop.ts` 扩展名白名单加 `.txt`；浏览器降级 `input.accept` 同步）。txt 按 Markdown 解析渲染（纯文本不受影响），`Cmd+S` 直接写回原 `.txt` 路径；不声明系统文件关联（双击 txt 不唤起 TMD），双链 / 图谱索引仍只扫 `.md`
  - **文件编码与换行保持**：打开时检测 UTF-8（含 BOM）/ UTF-16LE/BE / GBK，保存时按原编码与原换行（LF/CRLF）写回；全文搜索、双链扫描、外部修改监视使用同一解码器，CRLF 文件不再被误标脏。核心逻辑在 `electron/text-file.cjs`（纯 Node，可单测），渲染层 Tab 记录原始编码元信息，另存为时沿用
  - **PDF 导出选项**：设置面板新增纸张（A4/A3/A5/Letter/Legal）、方向、页边距（18/10/25mm）、页眉页脚（文档名/日期）、页码与 PDF 书签开关；主进程按选项生成 `printToPDF` 参数，书签从标题层级生成。选项持久化于 `tmd:pdf-options`，主进程对 IPC 入参再做白名单收窄
  - **离线 HTML 导出**：设置面板可开启「内联 Mermaid / KaTeX」；构建时把 Mermaid / KaTeX 运行时与 woff2 字体拷到 `dist/export-assets`，导出时主进程读取并内联（KaTeX CSS 字体转 data URI），断网打开 HTML 也能渲染图表与公式；资源缺失（未 build）时回退 CDN。导出文件约 4–5MB
  - **ePub 导出**：离屏渲染页完成 Markdown / Mermaid / KaTeX 渲染后，把正文序列化为 XHTML，打包为 EPUB 3（mimetype / container / content.opf / nav / content.xhtml / style.css）；导航按 1–3 级标题自动生成，KaTeX 样式随离线资源注入；主菜单与工具栏 ⋯ 菜单新增「导出 ePub」。**epubcheck（W3C 5.1.0，EPUB 3.3 规则）0 错误 0 警告**：Mermaid 图表栅格化为包内 PNG（其 SVG 含 foreignObject，Kindle / 旧版 Calibre 渲染不可靠），data URI 图片抽取为 `OEBPS/images/` 文件以相对路径引用，SVG 内标签 `p`→`span`、KaTeX MathML 剥元素间空白，OPF 按 `epubManifestProperties` 声明 `mathml`/`svg`
  - **原生 HTML 安全渲染（块级）**：Markdown 中独立成块的 `<details>` / `<div>` / `<table>` 等 HTML 由白名单 sanitizer 渲染——剔除 script/iframe/svg/事件处理器/style/class/id，链接与图片走协议白名单；源码在 Markdown 中原样保留，可在源码模式编辑。行内 HTML 标签对按文本保留（逐段渲染会破坏嵌套，属已记录取舍）。HTML / Word / 长图 / ePub 导出同样清洗后渲染；LaTeX 仍按纯文本/图片转换
  - **长图拼接内容重复（含保存内容翻倍）**：块级 HTML 的 remark 转换把 html 节点替换为无 `position` 的自定义节点，front matter 的原文切片依赖「下一个兄弟的 position」（缺失时回退到文末），导致文档起始的 HTML 块紧跟 front matter 时整篇正文被吞进 front matter value——保存 / 导出 / 长图内容成倍重复（×2/×4 随编辑同步周期放大）。现 html_block 与 toc 转换均保留原 position；长图截图分段在主进程 `setContentSize` 后按目标偏移重新滚动，防止视口调整重置滚动位置；导出 E2E 的接缝断言改为 ±200px 带内必有墨迹（原 ±2 行窄带在均匀稀疏内容下会落在段间空隙误报）
  - **Windows 安装向导自选目录即时显示 `\TMD`**：新增 `build/installer.nsh`（经 `nsis.include` 引入，同时把 `nsis.allowToChangeInstallationDirectory` 置 false 关闭模板内置页），用 nsDialogs 自绘目录页替换 MUI 内置页——点「浏览」选定文件夹后路径框立即回写 `<所选目录>\TMD` 并刷新磁盘空间信息，手工输入路径离开页面时做同样兜底修正；布局对齐内置页（目标文件夹分组框 + 所需/可用空间），文案复用 NSIS/MUI 预置语言字符串随向导语言自动切换，升级安装（`--updated`）仍按原行为跳过该页

  ### 修复

  - **另存为默认名硬编码**：此前任何标签「另存为」的默认名都是 `未命名.md`，打开 txt 后另存为会丢失原扩展名；现 `saveFileAs` IPC 增加可选 `defaultName` 参数，渲染层传当前标签名，txt 标签另存为默认保留 `.txt` 扩展名
  - **安装路径含 `TMD` 子串时文件平铺**：electron-builder 模板内置目录页的追加逻辑用 StrContains 在整条路径里查找产品名，`D:\MyTMDTools` 这类路径被误判为已经带上产品子目录、不再追加，文件直接平铺进所选目录；自绘页的 `tmdFixInstallDir` 只比较路径最后一段且幂等，误判随之消除
  - **文件式主题目录路径缺少 `.tmd` 段**：`themes-list` / `themes-read` / `themes-open-dir` 此前计算为 `<tmdRoot>/themes`（未设 `TMD_HOME_DIR` 时即用户主目录根的 `~/themes`），与文档、`themes.cjs` 的 `themesDir()`（`~/.tmd/themes`）及 logs / history / crash-dumps 的 `<tmdRoot>/.tmd/...` 布局不一致——设置面板「打开主题目录」会在用户主目录根部创建文件夹，按文档把 CSS 放进 `~/.tmd/themes` 时主题列表为空。现三处统一经 `themesDir(tmdRoot)` 计算（2026-09-30 9289f1d 引入，v0.1.0–v0.1.3 存在）；主题 IPC 首次访问时会把旧目录 `<tmdRoot>/themes` 下的 CSS 一次性补拷到新目录（同名文件不覆盖、旧文件保留），完成后写入 `<tmdRoot>/.tmd/.themes-migrated` 标记，之后不再扫描（删除标记可手动重跑），避免用户删除/改名主题后又被旧文件复活；新增 `src/__tests__/ipc-files.test.ts` 锁住路径、示例主题落盘位置与迁移行为
  - **大文件读入导致主进程 OOM**：`openFile` / `readFile` 增加 50MB 上限（`fs.stat` 预检，超限抛 `file too large: X MB (limit 50 MB)`）；同时拒绝目录 / FIFO / 字符设备等非普通文件（它们的 `stat.size` 可能为 0，只查大小会让 `fs.readFile` 持续读入或阻塞）；`snapshotBeforeWrite` 同步复用该读取（超限跳过历史快照但仍允许保存），堵住经 `saveFile` 传入任意大文件路径绕过上限的次生漏洞；`historyRead` 读取快照前同样做普通文件 + 50MB 预检，堵住旧版本超大快照的预览路径；渲染层识别超限错误后提示具体大小与上限，不再只显示通用「打开失败」
  - **恢复副本写入配额溢出打断编辑**：崩溃恢复副本的 localStorage 写入（`saveDoc`）加 try/catch 静默降级——副本丢失优于崩溃（调用方在编辑器 onChange 节流链路上，上抛会打断输入）；持续失败只 warn 一次（成功写入后重置警告位），避免配额满时 console 刷屏
  - **自动保存停止后 timer 未复位**：`stopAutosave` 清定时器后置 `timer = undefined`，避免调用方误判状态
  - **浏览器模式下载可能被掐断**：`files.ts` 下载链的 `revokeObjectURL` 由同步调用推迟到下一宏任务（与 `export.ts` 同一口径），避免部分浏览器刚开始的下载被中断

  ### 重构（无功能变化）

  - **主进程 main.cjs 按域拆分**：1748 行 → 539 行，拆出 7 个领域模块，主文件只留窗口 / 菜单生命周期、文件关联与装配。新模块全部沿用既有「工厂 + 依赖注入」模式（零顶层 `require('electron')`，与 exporter.cjs / menu.cjs 同构）、可脱离 Electron 单测：`app-state.cjs`（跨模块共享状态 store：mainWindow / rendererDirty / autosaveEnabled / menuLabels / customShortcuts / sortLocale / shellThemeSource 的 getter/setter）、`updater.cjs`（自动更新双源 + macOS dmg 自行下载安装 + 4 条 IPC + 启动 5s 自动检查）、`shell-state.cjs`（主题来源与窗口几何持久化）、`recent.cjs`（最近文件镜像 + 系统最近文档注册 + 4 条 IPC）、`ipc-files.cjs`（文件 / 目录 / 搜索 / 双链 / 主题 / 日志 / 历史 / 导出 / 打印，22 条通道）、`ipc-app.cjs`（状态同步 / 窗口控制 / 图片落盘 / 链接跳转，12 条通道）、`picgo.cjs`（PicGo 实例懒加载 + 配置读写，3 条通道）。模块间回调（buildMenu / flushPendingOpenPaths / sendToRenderer 等）经装配注入，模块不反向 require main。**46 条 IPC 通道与拆分前逐一比对一致**（31 handle + 14 on + 1 once），`npx tsc` / `npm test` / `npm run lint` 全过，桌面 E2E 主链路 49 断言 + 导出 36 断言全过，`npm run dist:dir` 产物模块齐全。顺带收敛少量 IPC 边界行为：`watchFiles` 过滤非字符串入参、`saveFileAs` 非字符串内容由返回 null 改为抛错（渲染层 catch 后 toast，等价）、`saveFile` 校验错误消息拆分、`dialogParent` 去掉不可达的可见窗口兜底——渲染层现有调用点均不受影响。新增 `app-state.cjs` 单测 7 例（加载默认值 / 进程内单例契约 / 布尔入参 `!!` 收窄 / 取值即取引用约定 / SHELL_BG 常量）

  ### 安全

  - **主进程敏感 IPC 增加主窗口 sender 校验**：`app-state.cjs` 新增 `assertMainWindow(event)`——`event.sender` 必须为主窗口 webContents（且窗口未销毁），否则抛 `forbidden`；接入 14 条高危通道：写盘 / 文件管理 / 导出（`saveFile` / `saveFileAs` / `createFile` / `createDir` / `renamePath` / `revealInFolder` / `exportAs`）、应用级（`saveImage` / `openExternal` / `openLocalFile`）、图床（`uploadImage` / `savePicGoConfig`）、更新（`updateDownload` / `updateInstall`）；`app-state.test.ts` 直测 `assertMainWindow` 的放行 / 拒绝两个方向，`ipc-files.test.ts` 验证 `saveFile` 的实际接线，`ipc-sender-guard.test.ts` 表驱动覆盖全部 14 条通道的外来 sender 拒绝。防护边界是**非主窗口 webContents**（隐藏离屏导出窗口、未来新增窗口）无法从渲染层发起敏感操作；主窗口内部的 XSS 仍会通过该口径（sender 即主窗口），故入参白名单（`saveImage` 裸文件名、`fsops` 路径清洗、50MB 读入上限）仍是主窗口侧的第一道防线。只读通道（`readFile` / `readDir` / 搜索 / 双链 / 历史与主题读取等）与系统对话框类（`print` 的另存为、打开日志 / 主题目录）保持原样
