releaseNotes: |
  ## [0.1.5] - 2026-10-20

  ### 新增

  - **右键菜单「移到回收站」**：文件树行 / 文件夹行 / 最近列表行的右键菜单末项新增「移到回收站」——确认后经主进程 `shell.trashItem` **移入系统回收站（可恢复，不做永久删除）**，树行即时消失；删除的是挂载根时连带取消挂载，失败（文件被占用等）toast 提示。文件与文件夹共用一项、确认文案按类型区分（文件夹提示「及其全部内容」）。被删除的文件若正打开在标签页中，标签保留、内容不丢，沿用外部修改流程提示「已从磁盘移除」。挂载根行另有「从列表中移除文件夹（不删除磁盘文件）」、最近列表行另有「从最近文件中移除」——措辞约定：**「移到回收站」＝磁盘操作，「从列表中移除」＝仅取消引用**；子文件 / 子目录是挂载夹的真实内容，移除后会被刷新带回，故不提供「从边栏移除」。菜单同时按类别分组（分隔线隔开）：**新建 / 重命名（改结构）｜在系统中显示 / 复制路径（只读）｜从列表中移除（仅挂载根）｜移到回收站（破坏性操作，独立末组）**
  - **文件树外部变化自动刷新**：系统文件管理器等外部途径新增 / 删除 / 改名文件或文件夹后，侧边栏已展开的树自动更新（无需重新挂载）。主进程 `electron/dirwatcher.cjs`（纯 Node，可脱壳单测）只监视「已加载目录」（挂载根 + 展开过的各级目录），差量挂/卸非递归 `fs.watch` 并按目录防抖合并事件；渲染层先重读目录并与缓存比对列表——文件内容保存不会造成无谓重渲染，列表真变化才失效该目录与后代缓存、重读展开中的目录并重绘
  - **侧边栏当前文件高亮**：文件树与最近列表中正在编辑的文件行用与文件夹一致的强调色标出，随标签切换即时移动；切到未保存的新文档时取消高亮。路径比较经 `isSameFsPath`（Windows 忽略大小写、分隔符归一），打开 / 切换 / 空白标签原地替换 / 侧边栏重渲染四条路径均同步
  - **文件树 / 标签页右键菜单支持复制路径**：文件树行、最近文件行与编辑器标签页的右键菜单新增「复制相对路径」「复制绝对路径」两项——点击即写入剪贴板并 toast 反馈。相对路径相对其挂载根计算（多根取最长前缀），不在任何挂载根下的最近文件不出现「复制相对路径」；标签页未保存到磁盘时两项置灰（相对路径项还要求文件位于某个挂载根下）。剪贴板写入优先 Clipboard API、不可用时回落 `execCommand`（浏览器降级壳层下同样可用），相对路径由 `src/fs-path.ts` 的 `relativeFsPath` 纯函数计算（分隔符边界前缀匹配、Windows 忽略大小写）

  ### 修复

  - **文件树右键菜单右侧留白过大**：菜单此前固定 `min-width: 148px`，条目文字加全部内边距仅约 100px 时，多余宽度全落在右侧（左右内边距不对称）。现改为按最宽条目自适应（与编辑区右键菜单同口径）——实测最长条目「复制绝对路径」左右留白各 19px 一致，菜单宽度 115px 贴合内容
