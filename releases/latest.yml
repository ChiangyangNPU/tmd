releaseNotes: |
  ## [0.1.2] - 2026-10-07

  ### 新增

  - **双链语法**：`[[目标]]` / `[[目标|别名]]` / `[[目标#标题]]`（src/wikilink.ts，仿 mark-ext 五段式：mdast transform + $remark 序列化 + 行内原子节点 + `]]` 输入规则带围栏守卫）；未解析目标弱化呈现、点击跟随打开（标题锚定位到对应标题），源码模式 lezer 行内扩展同步着色
  - **反向链接面板**：列出全工作区引用当前笔记的 `[[..]]`（按来源文件分组，点击打开并定位），数据来自按需扫描的双链索引（electron/wikilinks.cjs，复用 search.cjs 扫描范式 + 围栏跳过）；⋯ 菜单 / 命令面板 / Cmd/Ctrl+Shift+B 入口
  - **关系图谱（对齐 Obsidian）**：齿轮设置弹层——未解析目标入图为幽灵节点（空心虚线圆，提示待写笔记）、连线方向箭头、孤立笔记显隐、笔记名/路径搜索过滤（非匹配淡化）、按文件夹着色（挂载根 → 色板循环）、力参数滑杆（斥力/连线距离/居中力实时生效）；拖拽节点即固定（双击解钉，重置布局一键解钉重跑）
  - **局部图谱**：侧边栏「关系」面板（⋯ 菜单/命令面板入口），当前笔记的邻域迷你力导向图——出链实时解析（未保存新链接即时可见）+ 反链来自双链索引，1/2 层可切，悬停高亮、点击跳转，随编辑节拍刷新
  - **窗口记忆**：窗口尺寸 / 位置 / 最大化持久化并在启动恢复（移动缩放防抖落盘、关闭同步兜底；显示器拔插回落默认摆放）
  - **改名自动重写引用**：重命名笔记时自动更新全工作区指向它的 `[[..]]`（别名/标题锚/相对路径书写保留，围栏块不动；干净打开标签同步落盘并豁免重载提示，脏标签仅改内存待保存），toast 汇总更新文件数

  ### 修复

  - **字体系统**：字体预设 4 → 12（新增等宽写作 / 仿宋 / 霞鹜文楷 / 思源宋体 / Times / Charter / Segoe 雅黑 / Helvetica，跨平台回退栈）；选中字体类别后出现二级 chips 供择主字体（栈首替换，其余回退序保留），自定义栈输入保留
  - **界面**：⋯ 菜单四组分隔（文件视图 / 导出 / 文档工具 / 设置）；反向链接 / 关系图谱 / 局部图谱快捷键（Cmd+Shift+B/G/L，双向开关，可改键）；反链 / 图谱 / 局部面板头部 ✕ 显式关闭
  - 导出链路双链适配：HTML/Word/长图降级为 accent 色 span 文本、LaTeX 降级纯文本（被引用笔记不在单文件产物内，避免死链）
