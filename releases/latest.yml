releaseNotes: |
  ## [0.1.2] - 2026-10-01

  macOS 自动更新回归 Squirrel.Mac 自动安装（zip 产物 + electron-updater 全自动），并补上更新重启前的未保存修改处置。**本版为重新发布**：v0.1.2 首版曾改走「下载 dmg + 手动安装」（移除 zip 与 Squirrel 路径），发布后撤回重发——手动拖入一步的代价大于它规避的签名问题（ad-hoc 签名本就能通过 Squirrel 校验）；dmg 方案的完整决策记录保留在 docs/打包发布.md §4/§9.3 与 git 历史（5698a2c）。

  ### 平台与分发

  - **macOS 自动更新回归 zip（Squirrel.Mac）**：撤回 v0.1.2 首版的「下载 dmg + 手动安装」改动（revert 5698a2c / a3e308e / 10d1055），`mac.target` 恢复 dmg + zip 双产物——zip 供 electron-updater 全自动更新（Squirrel.Mac 流式解压原子替换，ad-hoc 签名可过 `SecStaticCodeCheckValidity` 校验），dmg 保留给网页手动安装；dmg 方案附带的 sha512 校验 / 一键打开安装包 / 下载隔离标记清除随 revert 一并移除（都依赖 dmg 手动路径，对 zip 流程无意义）。zip 约 112MB（deflate 已到 `Defl:X` 最高级，7z/LZMA 虽能压到 79MB 但 Squirrel 的解压命令 `/usr/bin/ditto` 不认），超 Gitee 附件 100MB 上限，仍由 GitHub Release 承载、元数据指向 GitHub；dmg（85MB）与 exe（96MB）挂 Gitee。签名保持 ad-hoc（`identity: "-"`）——**不能改用 `null`**：跳过签名会残留 Electron 预编译包的 linker-signed 签名，改名、换 Info.plist、裁剪语言包后与实际内容不符，Gatekeeper 据此判「已损坏，无法打开」且该状态下系统设置里没有放行入口（详见 docs/打包发布.md §4）
  - **更新重启前的「保存并重启」处置**：自动更新下载完成后（`update-downloaded` 弹窗与设置面板「立即重启」两个入口共用同一流程），若存在未保存的修改，不再落入窗口 close 拦截的通用「放弃修改并关闭/取消」确认（语义不对，且叠在更新流程上），改为三选——**保存并重启**（主进程经新增的 `tmd:doc-save-request` 通道请求渲染层，走与菜单保存同一条 `saveDocument` 串行队列；另存为对话框开多久都等、不设超时——超时后重启会把未写完的文档留在半路；渲染层以「是否仍有未保存标签」回报结果，任何标签未保存成功都不重启，已暂存的更新由 `autoInstallOnAppQuit` 在下次退出时自动安装）/ **放弃修改并重启**（复用关闭确认的语义：清恢复副本后销毁窗口绕过 beforeunload 的挂起序列化回写，防止被放弃的内容以恢复副本"复活"）/ **稍后**（不退出，下次退出时自动安装）。文档干净时维持原「立即重启/稍后」确认不变。顺带把关闭确认与更新流程重复的恢复副本清除逻辑提为共用 `clearRendererRecoveryCopy`
  - **`latest-mac.yml` 重复 dmg 条目修复**：electron-builder 在 `mac.target` 数组里 dmg 显式带 `arch` 时，会为同一个 dmg 写两条完全相同的记录（实测原始产物形态 `zip + dmg + dmg`，构建日志确认只构建了一次 DMG）；而 `patch-mac-dmg.mjs` 的正则未加 `g` 标志、只改写第一条，导致第二条残留 dmg 转换前的 sha512/size（指向的文件实际已是 ULMO 版本）。现改为全局替换同名条目并去重，元数据只保留一条 dmg
