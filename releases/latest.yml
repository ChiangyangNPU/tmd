releaseNotes: |
  ## [0.1.6] - 2026-10-25

  ### 新增

  - **AI 助手（选区动作 + 工作区问答）**：所见即所得编辑器内嵌 AI 助手，走 OpenAI 兼容协议——内置 OpenAI / DeepSeek（默认）/ Moonshot (Kimi) / 智谱 GLM / Ollama（本地）/ 自定义端点六种服务商预设（共用一套请求实现），设置面板「AI 助手」区块配置，默认关闭、显式触发。**网络只发生在主进程**：API Key 经 safeStorage 加密存 `userData/ai-config.json`，渲染层永远拿不到明文、只能得知是否已保存，CSP `connect-src` 无需放开。**选区动作（气泡）**：编辑区选中文本即浮出气泡，润色 / 改写 / 精简 / 扩写 / 翻译 / 纠错 / 规范 Markdown 七个动作流式预览，确认后单事务替换（一步撤销）——替换落点经 ProseMirror 事务映射跟随流式期间的编辑漂移（选区外编辑平移坐标继续替换，选区内被编辑则拒绝并提示重选）；思考型模型的 reasoning_content 以弱化区块展示；翻译方向按主体语种判断（中英混排不再误判）。**工作区问答（侧边栏面板）**：工具栏「AI 问答」打开，多轮对话；「发送上下文」三档开关装配选区 / 当前文档 / 已挂载文件夹片段，发送前徽标明示实际范围与检索档位；工作区检索两级——关键词预筛（本地零网络）+ 可选 embedding 重排（失败静默回退关键词序）。入口：`Cmd/Ctrl+J`（可在设置改键）与编辑区右键菜单「AI 助手…」。安全边界：全部 AI IPC 校验调用方为主窗口；消息与嵌入文本的数量 / 体积上限 + 角色白名单；非流式响应异常归一化为结构化错误码；浏览器模式整块降级。新增 AI 相关单测 92 例（actions / client / config / ipc / chat / retrieval 六个文件）
  - **AI 配置交互优化**：三处设置面板易误解的交互修正——①「启用 AI 助手」总开关**即拨即存**（此前混在整表单的显式保存里，拨完不点「保存 AI 配置」就退出、重进被磁盘值刷回关闭，看起来像「自动被关掉」；保存失败时拨回磁盘状态并提示；地址 / 模型 / Key 仍走显式保存，便于整组修改后统一测试连接）；② API Key 行内新增「保存」按钮：单字段增量 patch 立即落盘、不做整表单回填（其他未保存的输入不被冲掉），空输入提示先填写；③ 已保存 Key 显示**等长占位点**——输入框从不回显明文（渲染层拿不到 Key），此前保存后框内为空、无任何视觉反馈，现主进程 publicView 新增 `apiKeyLength`（仅长度、不含明文），界面据此渲染等长占位点；「留空 = 保持不变」的语义不变
  - **检查更新旁显示当前版本号**：设置面板「更新」区块的检查按钮右侧展示当前版本号，取值与「关于」区块同源（package.json），避免手动维护遗漏；状态文字改为可收缩换行，长文案（如 macOS 安装包落盘路径）不会把版本号顶出容器
  - **活动标签高亮**：编辑器标签栏当前活动标签的文字改用强调色（与文件边栏「当前打开文件」的高亮同色系），一眼区分正编辑的标签

  ### 工程与质量

  - **Gitee 附件配额自动清理**：Gitee 免费仓库 Release 附件总容量 1GB、每版约 175MB（dmg + exe + blockmap），v0.1.5 发布时累计 1036MB、末尾 blockmap 被配额拒绝导致发布 step 红灯（dmg / exe 与元数据已落库，Gitee 源可用但无差量更新）。发布工作流上传前新增配额维护：按创建时间保留最近 2 个版本（`KEEP_GITEE_RELEASES` 可调）的附件、更早版本逐个删除附件——Release 页面与更新说明保留，旧安装包仍可从 GitHub Release 下载；当前发版 Release 始终排除在清理之外，清理失败只告警不中断。docs/打包发布.md 新增 §9.4（1GB 配额、自动清理、手动清理与本地补传）
