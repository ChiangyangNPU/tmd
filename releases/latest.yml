releaseNotes: |
  ## [0.1.2] - 2026-09-30

  macOS 更新机制重构：不再依赖 Squirrel.Mac 自动安装（未公证构建必然卡在签名校验），改为「下载 dmg + 手动安装」，并连带解决由此暴露的签名有效性与下载隔离标记问题。

  ### 平台与分发

  - **macOS 自动更新改为「下载 dmg + 手动安装」**：v0.1.1 首次发布时 mac 产物只配了 dmg，electron-updater 取更新包时直接抛 "ZIP file not provided"（Squirrel.Mac 只认 zip 流式解压）。补上 zip 后又卡在更根本的一步：本项目未公证构建，Squirrel.Mac 的签名校验（`SecStaticCodeCheckValidity`）必然失败——表现为「更新失败：Code signature … did not pass validation」，既不重启也不进入安装界面；改用 ad-hoc 签名能让该校验通过，却仍过不了 Gatekeeper 的公证检查（首次打开照样被拦），收益有限。最终方案：mac 侧不再走 electron-updater 的下载/安装，只做**版本检查**——用户确认后由主进程把 dmg 下载到系统「下载」目录（带进度、自动处理重定向），并按元数据**校验 sha512**（不匹配即删除并报错，避免装到截断或被篡改的包），随后**清除下载隔离标记**（`xattr -d com.apple.quarantine`——Chromium 下载会打上该标记，拖进「应用程序」的 app 会继承它，而 `identity: null` 的构建会被 Gatekeeper 判「已损坏」；dmg 由我们自己下载且已校验，来源可信），完成后弹窗提供「打开安装包 / 打开所在文件夹 / 稍后」三项——「打开安装包」经 `shell.openPath` 直接弹出安装窗口，用户把 TMD 拖入「应用程序」即可；Windows 的 NSIS 不要求签名，保持全自动更新。连带简化：`mac.target` 移除 zip、`build.mac.identity` 保持 `"-"`（ad-hoc）——**实测确认不能改用 `null`**：跳过签名会让 Electron 预编译包自带的 linker-signed 签名残留下来，而改名、换 Info.plist、裁剪语言包之后它与实际内容不符，`codesign --verify` 报 `code has no resources but signature indicates they must be present`，Gatekeeper 据此判**「已损坏，无法打开」**，且**该状态下系统设置里没有放行入口**（「仍要打开」按钮只在提示「未验证的开发者」时出现，macOS 26 上尤其明显）；ad-hoc 则把结论降级为「Apple 无法验证开发者」，用户可右键「打开」或到系统设置点「仍要打开」——两者都未公证，差别在于 ad-hoc 给用户留了一条 GUI 放行路径。用户从网页手动下载 dmg 时仍需这一步（应用内更新路径已由 `clearQuarantine` 消除）——zip 原为 112MB（超 Gitee 附件 100MB 上限，一度被迫改由 GitHub 承载；实测 7z/LZMA 能压到 79MB 但 Squirrel 的解压命令 `/usr/bin/ditto` 不认，bzip2 同理，而 deflate 已到 `Defl:X` 最高级），移除后 dmg（85MB）与 exe（96MB）都能挂 Gitee，元数据 URL 全部指回 Gitee，`release.yml` 与 `prepare-gitee-release.mjs` 里的 GitHub 分流逻辑随之删除
  - **`latest-mac.yml` 重复 dmg 条目修复**：electron-builder 在 `mac.target` 数组里 dmg 显式带 `arch` 时，会为同一个 dmg 写两条完全相同的记录（实测原始产物形态 `zip + dmg + dmg`，构建日志确认只构建了一次 DMG）；而 `patch-mac-dmg.mjs` 的正则未加 `g` 标志、只改写第一条，导致第二条残留 dmg 转换前的 sha512/size（指向的文件实际已是 ULMO 版本）。现改为全局替换同名条目并去重，元数据只保留一条 dmg
