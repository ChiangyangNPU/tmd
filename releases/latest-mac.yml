releaseNotes: |
  ## [0.1.3] - 2026-10-14

  ### 新增

  - **设置面板拖拽移动**：按住设置面板标题栏即可拖动（`src/settings.ts` 新增 `wireSettingsDrag`），位置约束在视口内不会拖出屏幕、拖经编辑区不中断（指针捕获），重新打开恢复居中；标题栏加 `cursor: move`
  - **文件树任意层级懒加载展开**：子文件夹可逐层展开、层级不限（此前只递归两层，第二层以下的子目录被直接丢弃）。改为点开哪层读哪层——`electron/main.cjs` 的 `readDir` 只读当前一层、子目录返回空 `children` 占位，目录行加 ▸/▾ 折叠箭头，各层列表独立缓存并在渲染时递归注入；新建 / 重命名后只重读受影响的目录层，超大文件夹不再一次性递归整棵树；附带修复未展开根上点「＋文 / ＋夹」时输入框被异步重渲染清掉的竞态
  - **编辑区宽度「自适应」档**：新增该档并设为默认（`defaultTypography` 的 `pageWidth` 由 `''` 改为 `'auto'`，已主动选过档位的用户行为不变）——注入 `min(1120px, calc(100% - 64px))`，宽窗口下上限 1120px 避免行长过宽，窗口收窄或打开文件 / 大纲侧边栏时自动收缩、两侧各留 32px；纯 CSS 实现无需监听 resize，所见即所得 / 纯源码 / 玻璃主题预设同步生效
  - **标签页与最近文件「在系统中显示」**：标签页右键菜单末尾新增该项，跳到该笔记所在文件夹（macOS 在 Finder 中选中、Windows 在文件资源管理器中打开）；「最近打开」列表行也支持右键唤起同一菜单（此前只有 hover 移除按钮）；未保存到磁盘的新文档无绝对路径、浏览器降级壳层下无系统文件管理器，两种情况均置灰

  ### 修复

  - **设置面板误关闭**：点击设置面板以外的区域不再关闭面板（此前点遮罩空白处即消失），现只保留标题栏 ✕ 与 `ESC` 两种关闭方式
  - **大纲点击定位**：点击大纲条目时对应标题固定滚动到显示区域最上方（`scrollEditorPosIntoView` 新增 `align` 参数）——此前是最小滚动策略，标题已在可视区内就不滚动、不在时也只贴到最近边缘，看起来「位置不对」；查找替换与目录块保持原 `nearest` 行为
  - **⋯ 菜单缺「导出 PDF」入口**：原生菜单在 Windows 上被隐藏，此前 Windows 端没有任何可见的 PDF 导出入口；⋯ 菜单导出组补「导出 PDF」（置首，点击走既有动作，`Shift+P` 同键位），浏览器模式回退 `window.print` 故不隐藏
  - **PDF 导出静默失败**：`webContents.print` 的系统打印对话框在 macOS / Electron 44 下点击无反应（该路径此前从未被 E2E 覆盖）；改为 `printToPDF` 程序化生成（`printBackground` + `preferCSSPageSize` 走 `@page` 18mm + A4）+ 保存对话框直接落盘，渲染层传活动标签名作默认文件名、浏览器仍回退 `window.print`；菜单文案随之由「打印 / 导出 PDF」改为「导出 PDF」，默认文件名剥离 `.md` 扩展名（不再出现 `笔记A.md.pdf`）

  ### 工程与质量

  - **输入法诊断探针组**：新增 `scripts/ime-*.mjs` 五个探针，真机比对 Chromium 与 TMD 渲染层的按键 / 输入法事件序列与上屏结果，并留下「应用侧不拦截、不转换顿号 / 反斜杠」的回归防护；排查结论为「顿号变斜杠」属豆包输入法自身行为，应用侧无需改动
  - PDF 导出链路 E2E 补 3 项断言（出文件 / 文件头 / 体积）
