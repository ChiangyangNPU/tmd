releaseNotes: |
  ## [0.1.1] - 2026-10-04

  > 版本号说明：v0.1.1–v0.1.5 曾作为中间版本短暂存在，后删除弃用（内容整合进 [0.1.0]）；本版经确认复用 v0.1.1 号段，特此标注供历史追溯。

  ### 新增

  - **选区字数统计**：编辑区选中文字时工具栏实时切「已选 N / 共 M 字」双数字（ProseMirror 视图插件 + 150ms 合并刷新，拖拽选择不抖动），清除选区还原全文计数；源码模式保持全文计数
  - **TSV 粘贴转表格**：从 Excel/表格软件复制的纯文本（制表符分隔、≥2 行 × 2 列、列数对齐）粘贴即生成真实表格，首行作表头、表后自动补空段落承接光标（`src/paste-tsv.ts`，直接构建 ProseMirror 表格节点，与 gfm schema 同构）；富文本剪贴板优先走 HTML 转换管线，普通句子里的制表符不误触
  - **Ctrl/Cmd+滚轮缩放字号**：编辑区内滚轮逐级 ±1px（12–28 钳制，`src/font-zoom.ts`），触控板捏合同效；底部 HUD 原地刷新数值、停止滚动后淡出；经排版设置持久化，所见即所得与源码模式同步变化；仅编辑区接管（侧边栏/浮层滚轮不受影响）
  - **命令面板**：Ctrl/Cmd+Shift+A（可在设置中改键）唤起，模糊搜索并执行全部菜单动作（文件 / 导出 / 历史版本 / 设置）、格式化命令与视图切换（源码 / 分屏 / 自动保存）——命令与菜单共用同一批处理函数（命令即菜单），标题中文、关键词英文均可检索；↑↓ 选择、回车执行、Esc 关闭，交互与快速切换面板一致
  - **快速切换拼音首字母匹配**：中文名文件支持 `xmsm` → 项目说明.md 式检索（`src/pinyin-index.ts`，pinyin-pro 字典随面板首次打开动态 import 懒加载为独立 chunk，纯英文场景零开销；加载失败静默降级为仅原始名称匹配），首字母命中权重低于原始名称命中
  - **侧边栏文件管理**：文件夹根行 hover「＋文 / ＋夹」行内新建（自动补 .md、`wx`/`recursive:false` 拒绝覆盖、新建文件直接打开）；任意行右键「新建 / 重命名 / 在系统中显示」。名称经 `electron/fsops.cjs` 清洗（拒绝分隔符/穿越片段/隐藏文件/控制字符，路径拼装二次校验 basename）；重命名同步更新已打开标签的关联路径与外部修改监视，后续保存写回新路径
  - **外部修改检测与重载**：打开的文件在磁盘上被外部程序修改时自动感知（`electron/filewatcher.cjs` 内容指纹监视，自身写入不误报）——干净标签静默重载，脏标签顶部提示条二选一（重新加载并清脏 / 保留我的版本），文件被删除提示且内容保留；桌面主链路 E2E 新增 4 项断言（27 → 31）
  - 「液态玻璃 Pro」主题预设：在液态玻璃的半透明材质上引入真实折射——SVG feDisplacementMap 透镜（scripts/gen-lens-map.mjs 生成位移图）让工具栏、侧边栏、活动标签与全部浮层的边缘把背景内容弯曲压缩，呈现苹果 Liquid Glass 式的凸透镜质感；编辑纸张等大表面自动禁用折射避免比例失真；保留系统「降低透明度」与打印/导出 PDF 双兜底
  - 预设主题首帧即生效：构建期把全部预设 CSS 静态注入 index.html（vite 插件，与运行时注入同源 `src/theme-preset-css.ts`），boot.js 在首帧前恢复 `data-theme-preset` 属性，消除「先闪默认浅色再切玻璃」的启动闪变（文件式主题仍需异步读取，不参与首帧）

  ### 修复

  - 液态玻璃主题的浮层覆盖补齐：历史版本面板与编辑区右键菜单此前注释声称覆盖但选择器缺失，现真正玻璃化
  - **源码侧右键菜单**：Electron 无默认右键菜单，源码模式（含分屏源码栏）此前右键无任何反应——现与所见即所得共用自绘菜单，按上下文显示剪切 / 复制 / 粘贴（有选区剪切+复制+粘贴，无选区仅粘贴，分屏只读跟随侧仅复制，两侧同款）；粘贴走真实 paste 事件由 CodeMirror 处理，浏览器模式降级剪贴板 API 纯文本
  - **右键菜单残留**：标签栏与文件树右键菜单此前只在左键点击别处时关闭（右键不产生 click）——菜单开着时在窗口其他位置右键会出现两个菜单同屏；现三处右键菜单统一「别处右键先关旧菜单」，Esc 也纳入统一收口（此前标签栏 / 文件树菜单不响应 Esc）
  - **文件管理名称校验（Windows）**：`electron/fsops.cjs` 清洗补三类 Windows 专属拒绝——保留字符 `< > : " | ? *`（此前放行到写盘才报笼统失败）、尾部点（此前可创建资源管理器无法正常打开/删除的文件）、保留设备名 CON/PRN/AUX/NUL/COM1-9/LPT1-9（裸名与带扩展名）；POSIX 平台行为不变，校验为纯函数平台标记注入、双平台单测覆盖
