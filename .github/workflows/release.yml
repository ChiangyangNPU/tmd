# 发布工作流：push tag (v*) 触发，双平台打包并发布到 GitHub + Gitee 双 Release。
#
# 分工：publish job 先发 GitHub Release（分钟级），再自动上传 Gitee——
# 创建/复用 Gitee Release、推 releases/ 元数据提交、传附件。Gitee 跨国
# 链路慢（实测约 3.7 小时），步骤超时取 355 分钟（job 硬上限 6 小时）；
# 失败/超时时用本地快速通道补发：npm run release:gitee（docs/打包发布.md §9）。
# （2026-09-21 曾短暂改「CI 只发 GitHub、Gitee 本地手动」的方案 C，同日恢复
# 自动上传——53e72d4；本头注释曾在那次恢复时漏改，2026-10-04 校正。）
#
# - macOS arm64 + Windows x64 并行构建（--publish never，只构建不发布）
# - mac job 构建后把 dmg 转 ULMO 压缩（实测约 103MB → 85MB，
#   scripts/patch-mac-dmg.mjs），连带重算 latest-mac.yml 的 sha512/size
#   并删除过期 blockmap（差量索引与新文件不匹配，删除后更新器对 404 回退全量）
# - publish job：下载双平台 artifact，gh CLI 创建 GitHub Release（正文取当前
#   版本小节）并上传全部产物——**直接发布，不用草稿**（草稿对 electron-updater
#   不可见，会卡住 GitHub 源的自动更新）
# - Tauri 双轨（2026-10-28 起）：build-tauri job 用带签名脚本出 NSIS/dmg +
#   .sig，并生成 Tauri 更新器元数据 latest.json，与 Electron 产物**同 Release**
#   并存上传——老用户（Electron 更新源 latest*.yml）与 Tauri 更新源
#   （latest.json）互不干扰。双轨由 inputs.publish_tauri 控制：tag 推送默认
#   开，workflow_dispatch 可关（只发 Electron）
#
# 注意：
# - 发版前把 CHANGELOG 的 [未发布] 转正（CI 以 --strict 强制校验，缺失即失败）
# - Gitee 元数据经 CI 推到 Gitee master：远端会多出一个元数据提交，
#   本地下次 pushall 前先 git pull gitee master --no-rebase 合并（§9）
# - Tauri 签名私钥 Secret：TAURI_SIGNING_PRIVATE_KEY（tauri signer generate
#   产物内容，见 docs/打包发布.md §11.2）。**未配置时 build-tauri 失败**：
#   tag 推送下 publish 仍继续（Electron 发布不被拖死），但 Tauri 双轨无效；
#   配好 Secret 后自动恢复

name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      publish_tauri:
        description: '同时发布 Tauri 版（tag 推送时恒开；仅手动触发时可关）'
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  # Job 1：双平台打包（只构建不发布，发布统一在 publish job）
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            platform: mac
          - os: windows-latest
            platform: win
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      # 发版前校验：CHANGELOG 必须有当前版本小节（[未发布] 未转正则直接失败）。
      # electron-builder 的 releaseNotes 取自本步骤生成的 .release-notes.md，
      # 只含当前版本一节，更新弹窗不再出现整份变更历史
      - name: Extract release notes
        run: node scripts/extract-release-notes.mjs --strict
      # 仅 mac：dmg 安装窗口背景图（标题 + 当前版本号 + 拖拽箭头）
      - name: Make dmg background
        if: matrix.platform == 'mac'
        run: node scripts/make-dmg-background.mjs
      - name: Build & Package
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
        run: npm run build && npx electron-builder --publish never
      # 仅 mac：dmg 转 ULMO 压缩 + 重算更新元数据（脚本内非 darwin 直接返回，
      # win job 原样通过）
      - name: Post-process dmg (ULMO)
        if: matrix.platform == 'mac'
        run: node scripts/patch-mac-dmg.mjs
      # 上传产物 artifact 供 publish job 下载
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.platform }}
          path: |
            release/*.yml
            release/*.dmg
            release/*.exe
            release/*.blockmap
          retention-days: 7

  # Job 1.5：Tauri 双轨打包（带更新签名；产物与 Electron 同 Release 并存）。
  # tag 推送恒开；手动触发时可经 inputs.publish_tauri 关闭（只发 Electron）。
  # 私钥来自 Secret TAURI_SIGNING_PRIVATE_KEY（minisign，生成方式见 §11.2）；
  # mac 侧 Tauri 更新产物为 TMD.app.tar.gz（.sig 对应它而非 dmg——dmg 只作
  # 首次手动安装），updater 工件在 bundle/macos/。
  build-tauri:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            platform: mac
          - os: windows-latest
            platform: win
    runs-on: ${{ matrix.os }}
    if: github.event_name == 'push' || github.event.inputs.publish_tauri == 'true'
    env:
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - name: Build Tauri (signed)
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            npm run dist:tauri:win:signed
          else
            npm run dist:tauri:mac:signed
          fi
        shell: bash
      - name: Collect artifacts
        shell: bash
        run: |
          mkdir -p release
          # Windows：NSIS 安装包 + .sig（bundle/nsis/）
          # macOS：dmg（首装）+ updater 的 app.tar.gz 与 .sig（bundle/macos/）
          find src-tauri/target/release/bundle -type f \
            \( -name '*.exe' -o -name '*.exe.sig' -o -name '*.dmg' \
               -o -name '*.app.tar.gz' -o -name '*.app.tar.gz.sig' \) \
            -exec cp {} release/ \;
          ls -la release/
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: tauri-release-${{ matrix.platform }}
          path: |
            release/*.exe
            release/*.exe.sig
            release/*.dmg
            release/*.app.tar.gz
            release/*.app.tar.gz.sig
          retention-days: 7

  # Job 2：统一发布（GitHub Release + Gitee）
  publish:
    needs: [build, build-tauri]
    if: always() && needs.build.result == 'success' && (github.event_name == 'push' || (needs.build-tauri.result == 'success' || needs.build-tauri.result == 'skipped'))
    runs-on: ubuntu-latest
    # GitHub-hosted runner 单 job 硬上限 6 小时（平台限制，设超过也会被掐断）：
    # 取满 6 小时以容纳 Gitee 跨国传输（实测 3.7 小时）；
    # 若仍传不完，走本地快速通道补发（§9）
    timeout-minutes: 360
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      # 下载两个平台的产物（Electron：release-*；Tauri：tauri-release-*）
      - uses: actions/download-artifact@v4
        with:
          path: release
          pattern: release-*
          merge-multiple: true
      - uses: actions/download-artifact@v4
        if: needs.build-tauri.result == 'success'
        with:
          path: release
          pattern: tauri-release-*
          merge-multiple: true
      - name: List artifacts
        run: find release -type f | sort
      - name: Extract release notes
        run: node scripts/extract-release-notes.mjs --strict

      # ---------- Tauri 更新器元数据 latest.json（windows/mac 两平台条目；
      # .sig 内容即 signature 字段。只在 Tauri job 实际跑过时生成） ----------
      - name: Make Tauri latest.json
        if: needs.build-tauri.result == 'success'
        env:
          TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
        run: |
          WIN_SETUP=$(find release -name '*_x64-setup.exe' | head -1 || true)
          MAC_TARGZ=$(find release -name '*.app.tar.gz' | head -1 || true)
          ARGS=""
          if [ -n "$WIN_SETUP" ]; then
            ARGS="$ARGS --win-setup $WIN_SETUP --win-sig ${WIN_SETUP}.sig"
          fi
          if [ -n "$MAC_TARGZ" ]; then
            ARGS="$ARGS --mac-sig ${MAC_TARGZ}.sig --mac-url-name $(basename "$MAC_TARGZ")"
          fi
          node scripts/make-tauri-latest.mjs $ARGS --out release/latest.json ${TAG:+--tag "$TAG"}
          # 元数据同写入仓库 releases/ 供 Gitee raw 端点（与 Electron yml 同目录）
          mkdir -p releases
          cp release/latest.json releases/latest.json

      # ---------- GitHub Release（直接发布；草稿对 electron-updater 不可见） ----------
      - name: Publish to GitHub Release
        run: |
          TAG=${GITHUB_REF_NAME:-$(node -p "require('./package.json').version")}
          echo "Publishing to GitHub Release: $TAG"
          gh release view "$TAG" >/dev/null 2>&1 || \
            gh release create "$TAG" --title "$TAG" --notes-file .release-notes.md
          # 兜底转正：gh release view 只判断「存在」，不区分 draft；若已有同名
          # draft（更新器完全不可见，会卡死 GitHub 源自动更新）则强制发布
          gh release edit "$TAG" --draft=false
          # Electron（dmg/exe/blockmap/latest*.yml）+ Tauri（exe.sig/dmg/app.tar.gz
          # 及 .sig/latest.json）同 Release 并存；通配符按实际存在的文件工作
          for f in release/*.dmg release/*.exe release/*.blockmap release/latest*.yml \
                   release/*.exe.sig release/*.app.tar.gz release/*.app.tar.gz.sig release/latest.json; do
            [ -f "$f" ] || continue
            gh release upload "$TAG" "$f" --clobber
          done
          # 上传后校验（与 Gitee 侧同口径）：必须以服务端状态为准逐项核对，
          # 且 Release 必须已发布——宁可疑失败，也不静默发出残缺版本
          gh release view "$TAG" --json isDraft,assets > /tmp/gh-release.json
          MISSING=0
          if node -e "process.exit(JSON.parse(require('fs').readFileSync('/tmp/gh-release.json','utf8')).isDraft ? 0 : 1)"; then
            echo "::error::GitHub Release 仍为 draft 状态，electron-updater 不可见"
            MISSING=1
          fi
          for f in release/*.dmg release/*.exe release/*.blockmap release/latest*.yml \
                   release/*.exe.sig release/*.app.tar.gz release/*.app.tar.gz.sig release/latest.json; do
            [ -f "$f" ] || continue
            name=$(basename "$f")
            if node -e "
              const r = JSON.parse(require('fs').readFileSync('/tmp/gh-release.json','utf8'))
              process.exit((r.assets || []).some(a => a.name === process.argv[1]) ? 0 : 1)
            " "$name"; then
              echo "OK: $name"
            else
              echo "::error::GitHub 附件缺失: $name（上传后 API 校验未命中）"
              MISSING=1
            fi
          done
          if [ "$MISSING" -ne 0 ]; then
            echo "::error::GitHub Release 校验未通过（见上方缺失项）"
            exit 1
          fi
          echo "GitHub Release 已发布且附件齐全"

      # ---------- Gitee（跨国链路慢：实测 3.7 小时；受 runner 6 小时硬限制约束。
      # 步骤取 355 分钟：若超时由本步骤先行报错（错误信息可见），
      # 而非被平台在 360 分钟整强杀。传不完时本地跑 npm run release:gitee 快速补，见 §9） ----------
      - name: Upload to Gitee
        timeout-minutes: 355
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
          GITEE_OWNER: ChiangyangNPU
          GITEE_REPO: tmd
        run: |
          if [ -z "$GITEE_TOKEN" ]; then
            echo "::error::GITEE_TOKEN is not set (GitHub 仓库 Settings → Secrets 配置)"
            exit 1
          fi
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            TAG="$GITHUB_REF_NAME"
          else
            TAG="v$(node -p "require('./package.json').version")"
          fi
          echo "Publishing to Gitee tag: $TAG"

          # 1. 元数据 url 绝对化为 Gitee Release 附件地址。
          #    应用的 generic 更新源只按 baseUrl 拼接相对路径，若是文件名会去 raw
          #    目录找安装包而 404（安装包在 Release 附件区）；绝对 URL 直接生效
          node scripts/prepare-gitee-release.mjs --local

          # 2. 元数据经 git 推到 Gitee releases/ 目录（Gitee 对海外 IP 的 contents
          #    API 写操作返回 405，git 协议可用；分支必须 master——仓库默认分支）
          #    注意：这会往 Gitee master 加一个提交，本地下次 pushall 需先
          #    `git pull gitee master --no-rebase` 合并（详见 docs/打包发布.md §9）
          git clone --depth 1 "https://oauth2:${GITEE_TOKEN}@gitee.com/$GITEE_OWNER/$GITEE_REPO.git" /tmp/gitee-meta
          mkdir -p /tmp/gitee-meta/releases
          cp releases/*.yml /tmp/gitee-meta/releases/
          # Tauri 元数据同目录（raw 端点 https://...raw/master/releases/latest.json）
          if [ -f releases/latest.json ]; then
            cp releases/latest.json /tmp/gitee-meta/releases/
          fi
          git -C /tmp/gitee-meta config user.name "github-actions[bot]"
          git -C /tmp/gitee-meta config user.email "github-actions[bot]@users.noreply.github.com"
          git -C /tmp/gitee-meta add releases/
          if git -C /tmp/gitee-meta diff --cached --quiet; then
            echo "元数据无变化，跳过推送"
          else
            git -C /tmp/gitee-meta commit -m "chore: update release metadata for $TAG"
            git -C /tmp/gitee-meta push origin master
            echo "元数据已推送 Gitee releases/"
          fi

          # 3. 创建（或复用）Gitee Release——重跑时复用已有 Release，避免重复失败
          RELEASE_ID=$(curl -s -A "Mozilla/5.0 (compatible; tmd-release-bot/1.0)" \
            "https://gitee.com/api/v5/repos/$GITEE_OWNER/$GITEE_REPO/releases/tags/$TAG" \
            | node -e "let d='';process.stdin.on('data',c=>d+=c);process.stdin.on('end',()=>{try{console.log(JSON.parse(d).id||'')}catch{console.log('')}})")
          if [ -n "$RELEASE_ID" ]; then
            echo "复用已存在的 Gitee Release ID: $RELEASE_ID"
          else
            RELEASE_BODY=$(cat .release-notes.md 2>/dev/null || echo "See GitHub Release for details")
            RELEASE_RESP=$(curl -s -A "Mozilla/5.0 (compatible; tmd-release-bot/1.0)" -X POST \
              "https://gitee.com/api/v5/repos/$GITEE_OWNER/$GITEE_REPO/releases" \
              -F "access_token=$GITEE_TOKEN" \
              -F "tag_name=$TAG" \
              -F "name=$TAG" \
              --form-string "body=$RELEASE_BODY" \
              -F "target_commitish=master")
            RELEASE_ID=$(echo "$RELEASE_RESP" | node -e "let d='';process.stdin.on('data',c=>d+=c);process.stdin.on('end',()=>{try{console.log(JSON.parse(d).id||'')}catch{console.log('')}})")
            if [ -z "$RELEASE_ID" ]; then
              echo "::error::创建 Gitee Release 失败，响应: $RELEASE_RESP"
              exit 1
            fi
            echo "Created Gitee Release ID: $RELEASE_ID"
          fi

          # 3.5 配额维护：Gitee 免费仓库的 Release 附件总容量 1GB，每个版本约
          #     175MB（dmg 85 + exe 95），不清理则从第 6 个版本起上传必失败
          #     （v0.1.5 实测：总量 1036MB 时 0.1MB 的 blockmap 被配额挡下、
          #     step 红灯）。发版前保留最近 KEEP_GITEE_RELEASES 个版本的附件，
          #     更早版本的附件逐个删除——Release 页面与说明保留，旧安装包仍可
          #     从 GitHub Release 下载。删除失败只告警不中断：上传阶段的配额
          #     错误才是最终裁判。
          KEEP_GITEE_RELEASES="${KEEP_GITEE_RELEASES:-2}"
          PRUNE_IDS=$(curl -s -A "Mozilla/5.0 (compatible; tmd-release-bot/1.0)" \
            "https://gitee.com/api/v5/repos/$GITEE_OWNER/$GITEE_REPO/releases?per_page=100&access_token=$GITEE_TOKEN" \
            | KEEP="$KEEP_GITEE_RELEASES" CURRENT_ID="$RELEASE_ID" node -e "let d='';process.stdin.on('data',c=>d+=c);process.stdin.on('end',()=>{try{const list=JSON.parse(d);if(!Array.isArray(list))throw new Error('not array');const keep=Number(process.env.KEEP)||2;const sorted=[...list].sort((a,b)=>String(b.created_at).localeCompare(String(a.created_at)));const keepIds=new Set(sorted.slice(0,keep).map(r=>String(r.id)));keepIds.add(String(process.env.CURRENT_ID||''));for(const r of sorted){if(!keepIds.has(String(r.id))) console.log(r.id)}}catch(e){console.error('::warning::Gitee Release 列表解析失败，跳过配额清理')}})")
          for rid in $PRUNE_IDS; do
            ATTACH_IDS=$(curl -s -A "Mozilla/5.0 (compatible; tmd-release-bot/1.0)" \
              "https://gitee.com/api/v5/repos/$GITEE_OWNER/$GITEE_REPO/releases/$rid/attach_files?access_token=$GITEE_TOKEN" \
              | node -e "let d='';process.stdin.on('data',c=>d+=c);process.stdin.on('end',()=>{try{const list=JSON.parse(d);if(Array.isArray(list)){for(const a of list) console.log(a.id)}}catch{}})")
            for aid in $ATTACH_IDS; do
              code=$(curl -s -o /dev/null -w "%{http_code}" -X DELETE \
                "https://gitee.com/api/v5/repos/$GITEE_OWNER/$GITEE_REPO/releases/$rid/attach_files/$aid?access_token=$GITEE_TOKEN")
              echo "prune: release $rid attach $aid → HTTP $code"
            done
          done

          # 4. 上传附件——大文件（dmg/exe）并行，Gitee 对海外 IP 的限速若按单连接
          #    计算则吞吐翻倍；小文件（blockmap）串行。
          #    低速保护：15 分钟内平均速度低于 512B/s 才放弃（只拦死连接，
          #    实测约 13KB/s 的正常慢速传输不受影响）
          upload_asset() {
            local f="$1" name size_mb attempt code
            name=$(basename "$f")
            size_mb=$(( $(stat -c%s "$f") / 1024 / 1024 ))
            # 失败重试三次：跨国链路偶发中断（v0.1.1 实测 dmg 整包未落库，
            # 故另有上传后 API 校验兜底，见步骤 5）。v0.1.0 实测 2 次重试
            # 仍会双双失败（dmg 或 exe 各挂一轮），加到 4 次 + 拉长退避
            for attempt in 1 2 3 4; do
              echo "Uploading $name (${size_mb}MB) to Gitee Release (attempt $attempt)"
              code=$(curl -s -A "Mozilla/5.0 (compatible; tmd-release-bot/1.0)" \
                --speed-limit 512 --speed-time 900 \
                -o "/tmp/attach-${name}.json" -w "%{http_code}" -X POST \
                "https://gitee.com/api/v5/repos/$GITEE_OWNER/$GITEE_REPO/releases/$RELEASE_ID/attach_files" \
                -F "access_token=$GITEE_TOKEN" \
                -F "file=@$f")
              code="${code:-000}"
              if [ "$code" -ge 200 ] && [ "$code" -lt 300 ]; then
                echo "$code" > "/tmp/attach-${name}.code"
                return 0
              fi
              echo "::warning::$name 上传失败（HTTP $code），15s 后重试"
              sleep 15
            done
            # 两次都失败：仍落下最终状态码供步骤 4 判定
            echo "$code" > "/tmp/attach-${name}.code"
          }

          # 大文件并行上传：dmg 约 85MB、exe 约 96MB（Electron 与 Tauri 的 NSIS
          # 各一个 exe），均在 Gitee 附件单文件 100MB 上限内（不再产出 mac zip，
          # macOS 改走「下载 dmg 手动安装」；Tauri mac 更新件 app.tar.gz 较小，
          # 与 sig/blockmap/latest.json 一并走串行通道）
          BIG_FILES=""
          for f in release/*.dmg release/*.exe; do
            [ -f "$f" ] && BIG_FILES="$BIG_FILES $f"
          done
          for f in $BIG_FILES; do
            upload_asset "$f" &
          done
          wait
          for f in release/*.blockmap release/*.sig release/*.app.tar.gz \
                   release/latest.json; do
            [ -f "$f" ] || continue
            # 排除 mac zip 的差量索引：zip 本身超 100MB 上限不在 Gitee，
            # 孤儿 blockmap 无意义（差量更新会自然回退全量下载）
            case "$f" in *-mac.zip.blockmap) continue ;; esac
            upload_asset "$f"
          done

          ATTACH_FAILED=0
          for f in release/*.dmg release/*.exe release/*.blockmap release/*.sig \
                   release/*.app.tar.gz release/latest.json; do
            [ -f "$f" ] || continue
            case "$f" in *-mac.zip.blockmap) continue ;; esac
            name=$(basename "$f")
            code_file="/tmp/attach-${name}.code"
            # code 文件缺失 = 上传子进程异常结束且未落状态：按失败处理，不静默
            # 跳过（v0.1.1 的 dmg 即因此漏传：step 报成功而附件缺失）
            HTTP_CODE=$(cat "$code_file" 2>/dev/null || echo "000")
            if [ "$HTTP_CODE" -lt 200 ] || [ "$HTTP_CODE" -ge 300 ]; then
              size_mb=$(( $(stat -c%s "$f") / 1024 / 1024 ))
              echo "::error::Gitee 附件上传失败 $name (HTTP $HTTP_CODE): $(cat "/tmp/attach-${name}.json" 2>/dev/null)"
              if [ "$size_mb" -gt 100 ]; then
                echo "::error::$name 为 ${size_mb}MB，超过 Gitee 附件 100MB 上限"
              fi
              ATTACH_FAILED=1
            else
              echo "OK: $name"
            fi
          done
          if [ "$ATTACH_FAILED" -ne 0 ]; then
            echo "::error::有附件未能上传到 Gitee Release（可在本地跑 npm run release:gitee 后手动补传，见文档 §9）"
            exit 1
          fi
          # 5. 上传后校验：以 Gitee 侧附件列表为准逐项核对。HTTP 2xx 不等于
          #    附件已落库——v0.1.1 实测 dmg 上传「成功」但附件不存在，而元数据
          #    已指向它（macOS 下载与更新全 404）。缺失即失败退出：宁可 step
          #    红灯，不可静默发出残缺版本
          REMOTE_ASSETS=$(curl -s -A "Mozilla/5.0 (compatible; tmd-release-bot/1.0)" \
            "https://gitee.com/api/v5/repos/$GITEE_OWNER/$GITEE_REPO/releases/$RELEASE_ID" \
            | node -e "let d='';process.stdin.on('data',c=>d+=c);process.stdin.on('end',()=>{try{const r=JSON.parse(d);console.log((r.assets||[]).map(a=>a.name).join('\\n'))}catch{console.log('')}})")
          MISSING=0
          for f in release/*.dmg release/*.exe release/*.blockmap release/*.sig \
                   release/*.app.tar.gz release/latest.json; do
            [ -f "$f" ] || continue
            case "$f" in *-mac.zip.blockmap) continue ;; esac
            name=$(basename "$f")
            if ! printf '%s\\n' "$REMOTE_ASSETS" | grep -qx "$name"; then
              echo "::error::Gitee 附件缺失: $name（上传后 API 校验未命中）"
              MISSING=1
            fi
          done
          if [ "$MISSING" -ne 0 ]; then
            echo "::error::Gitee 附件校验失败——本地跑 npm run release:gitee 后手动补传缺失项，见 docs/打包发布.md §9"
            exit 1
          fi
          echo "Gitee 发布完成（安装包 + 元数据，附件经 API 校验齐全）"
