# 发布工作流：push tag (v*) 触发，双平台打包并发布到 GitHub Release。
#
# 分工（方案 C）：CI 只负责 GitHub；Gitee 由本地手动发布（详见 docs/打包发布.md §9）
# - 为什么 Gitee 不放在 CI：GitHub Actions runner 在海外，到 Gitee 的跨国链路
#   实测传输 170MB 附件需 1 小时以上（本地网络仅需分钟级），且 Gitee 对海外
#   IP 的 contents API 有 405 反爬拦截。CI 直推 Gitee master 还会造成仓库分叉
#   （远程多出元数据提交，本地 push 被拒），本地手动提交则天然双端一致
#
# - macOS arm64 + Windows x64 并行构建（--publish never，只构建不发布）
# - mac job 构建后把 dmg 转 ULMO 压缩（实测约 103MB → 85MB，
#   scripts/patch-mac-dmg.mjs），连带重算 latest-mac.yml 的 sha512/size
#   并删除过期 blockmap（差量索引与新文件不匹配，删除后更新器对 404 回退全量）
# - publish job：下载双平台 artifact，gh CLI 创建 GitHub Release（正文取当前
#   版本小节）并上传全部产物——**直接发布，不用草稿**（草稿对 electron-updater
#   不可见，会卡住 GitHub 源的自动更新）
#
# 注意：
# - 发版前把 CHANGELOG 的 [未发布] 转正（CI 以 --strict 强制校验，缺失即失败）
# - Gitee 发布由本地执行：npm run dist 打包后运行 scripts/prepare-gitee-release.mjs
#   生成待上传清单与元数据，按 docs/打包发布.md §9 操作

name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # Job 1：双平台打包（只构建不发布，发布统一在 publish job）
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            platform: mac
          - os: windows-latest
            platform: win
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      # 发版前校验：CHANGELOG 必须有当前版本小节（[未发布] 未转正则直接失败）。
      # electron-builder 的 releaseNotes 取自本步骤生成的 .release-notes.md，
      # 只含当前版本一节，更新弹窗不再出现整份变更历史
      - name: Extract release notes
        run: node scripts/extract-release-notes.mjs --strict
      # 仅 mac：dmg 安装窗口背景图（标题 + 当前版本号 + 拖拽箭头）
      - name: Make dmg background
        if: matrix.platform == 'mac'
        run: node scripts/make-dmg-background.mjs
      - name: Build & Package
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
        run: npm run build && npx electron-builder --publish never
      # 仅 mac：dmg 转 ULMO 压缩 + 重算更新元数据（脚本内非 darwin 直接返回，
      # win job 原样通过）
      - name: Post-process dmg (ULMO)
        if: matrix.platform == 'mac'
        run: node scripts/patch-mac-dmg.mjs
      # 上传产物 artifact 供 publish job 下载
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.platform }}
          path: |
            release/*.yml
            release/*.dmg
            release/*.exe
            release/*.blockmap
          retention-days: 7

  # Job 2：统一发布（GitHub Release + Gitee）
  publish:
    needs: build
    runs-on: ubuntu-latest
    # GitHub-hosted runner 单 job 硬上限 6 小时（平台限制，设超过也会被掐断）：
    # 取满 6 小时以容纳 Gitee 跨国传输（实测 3.7 小时）；
    # 若仍传不完，走本地快速通道补发（§9）
    timeout-minutes: 360
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      # 下载两个平台的产物
      - uses: actions/download-artifact@v4
        with:
          path: release
          pattern: release-*
          merge-multiple: true
      - name: List artifacts
        run: find release -type f | sort
      - name: Extract release notes
        run: node scripts/extract-release-notes.mjs --strict

      # ---------- GitHub Release（草稿，人工核对后 Publish） ----------
      - name: Publish to GitHub Release
        run: |
          TAG=${GITHUB_REF_NAME:-$(node -p "require('./package.json').version")}
          echo "Publishing to GitHub Release: $TAG"
          gh release view "$TAG" >/dev/null 2>&1 || \
            gh release create "$TAG" --title "$TAG" --notes-file .release-notes.md
          for f in release/*.dmg release/*.exe release/*.blockmap release/latest*.yml; do
            [ -f "$f" ] || continue
            gh release upload "$TAG" "$f" --clobber
          done
          echo "GitHub Release assets updated"

      # ---------- Gitee（跨国链路慢：实测 3.7 小时；受 runner 6 小时硬限制约束。
      # 步骤取 355 分钟：若超时由本步骤先行报错（错误信息可见），
      # 而非被平台在 360 分钟整强杀。传不完时本地跑 npm run release:gitee 快速补，见 §9） ----------
      - name: Upload to Gitee
        timeout-minutes: 355
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
          GITEE_OWNER: ChiangyangNPU
          GITEE_REPO: tmd
        run: |
          if [ -z "$GITEE_TOKEN" ]; then
            echo "::error::GITEE_TOKEN is not set (GitHub 仓库 Settings → Secrets 配置)"
            exit 1
          fi
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            TAG="$GITHUB_REF_NAME"
          else
            TAG="v$(node -p "require('./package.json').version")"
          fi
          echo "Publishing to Gitee tag: $TAG"

          # 1. 元数据 url 绝对化为 Gitee Release 附件地址。
          #    应用的 generic 更新源只按 baseUrl 拼接相对路径，若是文件名会去 raw
          #    目录找安装包而 404（安装包在 Release 附件区）；绝对 URL 直接生效
          node scripts/prepare-gitee-release.mjs --local

          # 2. 元数据经 git 推到 Gitee releases/ 目录（Gitee 对海外 IP 的 contents
          #    API 写操作返回 405，git 协议可用；分支必须 master——仓库默认分支）
          #    注意：这会往 Gitee master 加一个提交，本地下次 pushall 需先
          #    `git pull gitee master --no-rebase` 合并（详见 docs/打包发布.md §9）
          git clone --depth 1 "https://oauth2:${GITEE_TOKEN}@gitee.com/$GITEE_OWNER/$GITEE_REPO.git" /tmp/gitee-meta
          mkdir -p /tmp/gitee-meta/releases
          cp releases/*.yml /tmp/gitee-meta/releases/
          git -C /tmp/gitee-meta config user.name "github-actions[bot]"
          git -C /tmp/gitee-meta config user.email "github-actions[bot]@users.noreply.github.com"
          git -C /tmp/gitee-meta add releases/
          if git -C /tmp/gitee-meta diff --cached --quiet; then
            echo "元数据无变化，跳过推送"
          else
            git -C /tmp/gitee-meta commit -m "chore: update release metadata for $TAG"
            git -C /tmp/gitee-meta push origin master
            echo "元数据已推送 Gitee releases/"
          fi

          # 3. 创建（或复用）Gitee Release——重跑时复用已有 Release，避免重复失败
          RELEASE_ID=$(curl -s -A "Mozilla/5.0 (compatible; tmd-release-bot/1.0)" \
            "https://gitee.com/api/v5/repos/$GITEE_OWNER/$GITEE_REPO/releases/tags/$TAG" \
            | node -e "let d='';process.stdin.on('data',c=>d+=c);process.stdin.on('end',()=>{try{console.log(JSON.parse(d).id||'')}catch{console.log('')}})")
          if [ -n "$RELEASE_ID" ]; then
            echo "复用已存在的 Gitee Release ID: $RELEASE_ID"
          else
            RELEASE_BODY=$(cat .release-notes.md 2>/dev/null || echo "See GitHub Release for details")
            RELEASE_RESP=$(curl -s -A "Mozilla/5.0 (compatible; tmd-release-bot/1.0)" -X POST \
              "https://gitee.com/api/v5/repos/$GITEE_OWNER/$GITEE_REPO/releases" \
              -F "access_token=$GITEE_TOKEN" \
              -F "tag_name=$TAG" \
              -F "name=$TAG" \
              --form-string "body=$RELEASE_BODY" \
              -F "target_commitish=master")
            RELEASE_ID=$(echo "$RELEASE_RESP" | node -e "let d='';process.stdin.on('data',c=>d+=c);process.stdin.on('end',()=>{try{console.log(JSON.parse(d).id||'')}catch{console.log('')}})")
            if [ -z "$RELEASE_ID" ]; then
              echo "::error::创建 Gitee Release 失败，响应: $RELEASE_RESP"
              exit 1
            fi
            echo "Created Gitee Release ID: $RELEASE_ID"
          fi

          # 4. 上传附件——大文件（dmg/exe）并行，Gitee 对海外 IP 的限速若按单连接
          #    计算则吞吐翻倍；小文件（blockmap）串行。
          #    低速保护：15 分钟内平均速度低于 512B/s 才放弃（只拦死连接，
          #    实测约 13KB/s 的正常慢速传输不受影响）
          upload_asset() {
            local f="$1" name size_mb
            name=$(basename "$f")
            size_mb=$(( $(stat -c%s "$f") / 1024 / 1024 ))
            echo "Uploading $name (${size_mb}MB) to Gitee Release"
            local code
            code=$(curl -s -A "Mozilla/5.0 (compatible; tmd-release-bot/1.0)" \
              --speed-limit 512 --speed-time 900 \
              -o "/tmp/attach-${name}.json" -w "%{http_code}" -X POST \
              "https://gitee.com/api/v5/repos/$GITEE_OWNER/$GITEE_REPO/releases/$RELEASE_ID/attach_files" \
              -F "access_token=$GITEE_TOKEN" \
              -F "file=@$f")
            echo "${code:-000}" > "/tmp/attach-${name}.code"
          }

          BIG_FILES=""
          for f in release/*.dmg release/*.exe; do
            [ -f "$f" ] && BIG_FILES="$BIG_FILES $f"
          done
          for f in $BIG_FILES; do
            upload_asset "$f" &
          done
          wait
          for f in release/*.blockmap; do
            [ -f "$f" ] || continue
            upload_asset "$f"
          done

          ATTACH_FAILED=0
          for f in release/*.dmg release/*.exe release/*.blockmap; do
            [ -f "$f" ] || continue
            name=$(basename "$f")
            code_file="/tmp/attach-${name}.code"
            [ -f "$code_file" ] || continue
            HTTP_CODE=$(cat "$code_file")
            if [ "$HTTP_CODE" -lt 200 ] || [ "$HTTP_CODE" -ge 300 ]; then
              size_mb=$(( $(stat -c%s "$f") / 1024 / 1024 ))
              echo "::error::Gitee 附件上传失败 $name (HTTP $HTTP_CODE): $(cat "/tmp/attach-${name}.json" 2>/dev/null)"
              if [ "$size_mb" -gt 100 ]; then
                echo "::error::$name 为 ${size_mb}MB，超过 Gitee 附件 100MB 上限"
              fi
              ATTACH_FAILED=1
            else
              echo "OK: $name"
            fi
          done
          if [ "$ATTACH_FAILED" -ne 0 ]; then
            echo "::error::有附件未能上传到 Gitee Release（可在本地跑 npm run release:gitee 后手动补传，见文档 §9）"
            exit 1
          fi
          echo "Gitee 发布完成（安装包 + 元数据）"

