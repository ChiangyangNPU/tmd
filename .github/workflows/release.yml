# 发布工作流：push tag (v*) 触发，Tauri（Rust 架构）双平台打包并发布到
# GitHub + Gitee 双 Release。
#
# Electron 壳已下线（2026-11，最后版本 0.1.8 随 v0.2.1 发布）：0.1.x 老用户
# 的更新/迁移路径靠**冻结元数据**维持——仓库 releases/ 下的 latest*.yml
# （指向 v0.2.1 的 Electron 0.1.8 附件）与 migration.json（指向 v0.2.1 的
# Rust 安装包）不再更新；publish job 每次发版把冻结副本一并上传 GitHub
# Release，保证 electron-updater 的 `releases/latest/download/latest*.yml`
# 备用源永远可用。Gitee 配额清理以 MIGRATION_KEEP_TAG 锚点保护 v0.2.1
# 附件不被清理。0.1.x 用户清零后：删除 Make migration.json 步骤、
# MIGRATION_KEEP_TAG env 与冻结元数据续传步骤即可彻底收尾。
#
# 分工：publish job 先发 GitHub Release（分钟级），再自动上传 Gitee——
# 创建/复用 Gitee Release、推 releases/ 元数据提交、传附件。Gitee 跨国
# 链路慢（实测约 3.7 小时），步骤超时取 355 分钟（job 硬上限 6 小时）；
# 失败/超时时用本地快速通道补发：npm run release:gitee（docs/打包发布.md §9）。
#
# - build-tauri job：macOS arm64 + Windows x64 并行，带更新签名（NSIS/dmg +
#   .sig），并生成 Tauri 更新器元数据 latest.json
# - publish job：下载双平台 artifact，gh CLI 创建 GitHub Release（正文取当前
#   版本小节）并上传全部产物——**直接发布，不用草稿**
#
# 注意：
# - 发版前把 CHANGELOG 的 [未发布] 转正（CI 以 --strict 强制校验，缺失即失败）
# - Gitee 元数据经 CI 推到 Gitee master：远端会多出一个元数据提交，
#   本地下次 pushall 前先 git pull gitee master --no-rebase 合并（§9）
# - Tauri 签名私钥 Secret：TAURI_SIGNING_PRIVATE_KEY（tauri signer generate
#   产物内容，见 docs/打包发布.md §11.2）。**未配置时 build-tauri 失败**

name: Release

env:
  # 迁移锚点：老用户（Electron 0.1.x）更新/迁移链路依赖的 Release 附件
  # （0.1.8 安装包 + 0.2.1 Rust 包），配额清理永远跳过该 tag 的 Release。
  # 0.1.x 用户清零后删除本 env 与冻结元数据续传步骤，彻底收尾。
  MIGRATION_KEEP_TAG: v0.2.1

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # Job 1：Tauri 双平台打包（带更新签名）。
  # 私钥来自 Secret TAURI_SIGNING_PRIVATE_KEY（minisign，生成方式见 §11.2）；
  # mac 侧 Tauri 更新产物为 TMD.app.tar.gz（.sig 对应它而非 dmg——dmg 只作
  # 首次手动安装），updater 工件在 bundle/macos/。
  build-tauri:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            platform: mac
          - os: windows-latest
            platform: win
    runs-on: ${{ matrix.os }}
    env:
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - name: Build Tauri (signed)
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            npm run dist:tauri:win:signed
          else
            npm run dist:tauri:mac:signed
          fi
        shell: bash
      - name: GUI smoke (macOS)
        # 用真实产物跑页面断言（scripts/tauri-mac-check.mjs）：覆盖 DOM、壳层注入、
        # 文件通道与格式化快捷键。首轮先以 continue-on-error 观察 CI 的 GUI 会话
        # 能否 open 启动，稳定后删掉该行改为发布门禁。
        if: matrix.platform == 'mac'
        continue-on-error: true
        shell: bash
        run: |
          pkill -f "TMD.app/Contents/MacOS" || true
          TMD_APP_PATH="$PWD/src-tauri/target/release/bundle/macos/TMD.app" npm run smoke:mac
      - name: Collect artifacts
        shell: bash
        run: |
          mkdir -p release
          # Windows：NSIS 安装包 + .sig（bundle/nsis/）
          # macOS：dmg（首装）+ updater 的 app.tar.gz 与 .sig（bundle/macos/）
          find src-tauri/target/release/bundle -type f \
            \( -name '*.exe' -o -name '*.exe.sig' -o -name '*.dmg' \
               -o -name '*.app.tar.gz' -o -name '*.app.tar.gz.sig' \) \
            -exec cp {} release/ \;
          ls -la release/
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: tauri-release-${{ matrix.platform }}
          path: |
            release/*.exe
            release/*.exe.sig
            release/*.dmg
            release/*.app.tar.gz
            release/*.app.tar.gz.sig
          retention-days: 7

  # Job 2：统一发布（GitHub Release + Gitee）
  publish:
    needs: [build-tauri]
    if: always() && needs.build-tauri.result == 'success'
    runs-on: ubuntu-latest
    # GitHub-hosted runner 单 job 硬上限 6 小时（平台限制，设超过也会被掐断）：
    # 取满 6 小时以容纳 Gitee 跨国传输（实测 3.7 小时）；
    # 若仍传不完，走本地快速通道补发（§9）
    timeout-minutes: 360
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      # 下载双平台 Tauri 产物 + 冻结的 Electron 元数据续传。
      # Electron 壳已下线：latest*.yml 不再构建产出，但 0.1.x 老用户的
      # electron-updater 备用源（releases/latest/download/latest*.yml）指向
      # 「最新 Release」的附件——新 Release 若缺这两个文件，备用源 404。
      # 故把仓库 releases/ 里的冻结副本（0.1.8，指向 v0.2.1 附件）cp 进
      # release/ 一并上传，主源（Gitee raw releases/）同样由冻结副本覆盖。
      - uses: actions/download-artifact@v4
        with:
          path: release
          pattern: tauri-release-*
          merge-multiple: true
      - name: Seed frozen Electron metadata
        run: |
          cp releases/latest.yml releases/latest-mac.yml release/
          ls -la release/*.yml
      - name: List artifacts
        run: find release -type f | sort
      - name: Extract release notes
        run: node scripts/extract-release-notes.mjs --strict

      # ---------- Tauri 更新器元数据 latest.json（windows/mac 两平台条目；
      # .sig 内容即 signature 字段） ----------
      - name: Make Tauri latest.json
        env:
          TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
        run: |
          WIN_SETUP=$(find release -name '*_x64-setup.exe' | head -1 || true)
          MAC_TARGZ=$(find release -name '*.app.tar.gz' | head -1 || true)
          ARGS=""
          if [ -n "$WIN_SETUP" ]; then
            ARGS="$ARGS --win-setup $WIN_SETUP --win-sig ${WIN_SETUP}.sig"
          fi
          if [ -n "$MAC_TARGZ" ]; then
            ARGS="$ARGS --mac-sig ${MAC_TARGZ}.sig --mac-url-name $(basename "$MAC_TARGZ")"
          fi
          node scripts/make-tauri-latest.mjs $ARGS --out release/latest.json ${TAG:+--tag "$TAG"}
          # 元数据同写入仓库 releases/ 供 Gitee raw 端点（与 Electron yml 同目录）
          mkdir -p releases
          cp release/latest.json releases/latest.json

      # ---------- 架构迁移提示（Electron 0.1.x 老用户 → Rust 版） ----------
      # 无条件生成，版本跟随当前发版：0.1.8 用户拉取后永远被引导到最新
      # Rust 安装包。跨架构无法自动升级，只做引导。0.1.x 用户清零后删除
      # 本步骤 + MIGRATION_KEEP_TAG env + 冻结元数据续传步骤即可收尾。
      - name: Make migration.json
        env:
          TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
        run: |
          # 迁移目标是 Rust 架构包：Tauri 产物命名 TMD_<ver>_<arch>.dmg /
          # TMD_<ver>_x64-setup.exe（下划线）——按 TMD_ 前缀限定，避免
          # `*.dmg` 通配抓到冻结的 Electron 包把 mac 用户引回旧架构（v0.2.1 实测）
          MAC_DMG=$(find release -name 'TMD_*.dmg' | head -1 || true)
          WIN_SETUP=$(find release -name '*_x64-setup.exe' | head -1 || true)
          ARGS=""
          [ -n "$MAC_DMG" ] && ARGS="$ARGS --mac-dmg $(basename "$MAC_DMG")"
          [ -n "$WIN_SETUP" ] && ARGS="$ARGS --win-setup $(basename "$WIN_SETUP")"
          node scripts/make-migration-json.mjs \
            --version "$(node -p "require('./package.json').version")" $ARGS \
            --out release/migration.json ${TAG:+--tag "$TAG"}
          mkdir -p releases
          cp release/migration.json releases/migration.json

      # ---------- GitHub Release（直接发布，不用草稿） ----------
      - name: Publish to GitHub Release
        run: |
          TAG=${GITHUB_REF_NAME:-$(node -p "require('./package.json').version")}
          echo "Publishing to GitHub Release: $TAG"
          gh release view "$TAG" >/dev/null 2>&1 || \
            gh release create "$TAG" --title "$TAG" --notes-file .release-notes.md
          # 兜底转正：gh release view 只判断「存在」，不区分 draft；若已有同名
          # draft（更新器完全不可见，会卡死 GitHub 源自动更新）则强制发布
          gh release edit "$TAG" --draft=false
          # Tauri（exe/+.sig、dmg、app.tar.gz/+.sig、latest.json）+ migration.json
          # + 冻结的 Electron latest*.yml（0.1.x 老用户备用源续传）；
          # 通配符按实际存在的文件工作
          for f in release/*.dmg release/*.exe release/latest*.yml \
                   release/*.exe.sig release/*.app.tar.gz release/*.app.tar.gz.sig release/latest.json \
                   release/migration.json; do
            [ -f "$f" ] || continue
            gh release upload "$TAG" "$f" --clobber
          done
          # 上传后校验（与 Gitee 侧同口径）：必须以服务端状态为准逐项核对，
          # 且 Release 必须已发布——宁可疑失败，也不静默发出残缺版本
          gh release view "$TAG" --json isDraft,assets > /tmp/gh-release.json
          MISSING=0
          if node -e "process.exit(JSON.parse(require('fs').readFileSync('/tmp/gh-release.json','utf8')).isDraft ? 0 : 1)"; then
            echo "::error::GitHub Release 仍为 draft 状态"
            MISSING=1
          fi
          for f in release/*.dmg release/*.exe release/latest*.yml \
                   release/*.exe.sig release/*.app.tar.gz release/*.app.tar.gz.sig release/latest.json \
                   release/migration.json; do
            [ -f "$f" ] || continue
            name=$(basename "$f")
            if node -e "
              const r = JSON.parse(require('fs').readFileSync('/tmp/gh-release.json','utf8'))
              process.exit((r.assets || []).some(a => a.name === process.argv[1]) ? 0 : 1)
            " "$name"; then
              echo "OK: $name"
            else
              echo "::error::GitHub 附件缺失: $name（上传后 API 校验未命中）"
              MISSING=1
            fi
          done
          if [ "$MISSING" -ne 0 ]; then
            echo "::error::GitHub Release 校验未通过（见上方缺失项）"
            exit 1
          fi
          echo "GitHub Release 已发布且附件齐全"

      # ---------- Gitee（跨国链路慢：实测 3.7 小时；受 runner 6 小时硬限制约束。
      # 步骤取 355 分钟：若超时由本步骤先行报错（错误信息可见），
      # 而非被平台在 360 分钟整强杀。传不完时本地跑 npm run release:gitee 快速补，见 §9） ----------
      - name: Upload to Gitee
        timeout-minutes: 355
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
          GITEE_OWNER: ChiangyangNPU
          GITEE_REPO: tmd
        run: |
          if [ -z "$GITEE_TOKEN" ]; then
            echo "::error::GITEE_TOKEN is not set (GitHub 仓库 Settings → Secrets 配置)"
            exit 1
          fi
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            TAG="$GITHUB_REF_NAME"
          else
            TAG="v$(node -p "require('./package.json').version")"
          fi
          echo "Publishing to Gitee tag: $TAG"

          # 1. 元数据来源：Tauri latest.json / migration.json 由上方步骤生成并
          #    cp 进仓库 releases/（url 已绝对化为 Gitee Release 附件地址）；
          #    Electron latest*.yml 为仓库内冻结副本（0.1.8，指向 v0.2.1 附件），
          #    保持原样提交——generic 更新源只按 baseUrl 拼接相对路径，绝对
          #    URL 会被直接使用，安装包在 Release 附件区不在 raw 目录。

          # 2. 元数据经 git 推到 Gitee releases/ 目录（Gitee 对海外 IP 的 contents
          #    API 写操作返回 405，git 协议可用；分支必须 master——仓库默认分支）
          #    注意：这会往 Gitee master 加一个提交，本地下次 pushall 需先
          #    `git pull gitee master --no-rebase` 合并（详见 docs/打包发布.md §9）
          #    跨国链路偶发不可达（v0.2.1 实测 git exit 128，5 分钟后放弃）：
          #    克隆与推送各重试 3 次、退避递增
          clone_ok=0
          for attempt in 1 2 3; do
            rm -rf /tmp/gitee-meta
            if git clone --depth 1 "https://oauth2:${GITEE_TOKEN}@gitee.com/$GITEE_OWNER/$GITEE_REPO.git" /tmp/gitee-meta; then
              clone_ok=1
              break
            fi
            echo "::warning::Gitee 仓库克隆失败（第 $attempt 次），$((attempt * 20))s 后重试"
            sleep $((attempt * 20))
          done
          if [ "$clone_ok" != 1 ]; then
            echo "::error::Gitee 仓库克隆失败（3 次重试均未成功，检查 GITEE_TOKEN 与链路）"
            exit 1
          fi
          mkdir -p /tmp/gitee-meta/releases
          cp releases/*.yml /tmp/gitee-meta/releases/
          # Tauri 元数据同目录（raw 端点 https://...raw/master/releases/latest.json）
          if [ -f releases/latest.json ]; then
            cp releases/latest.json /tmp/gitee-meta/releases/
          fi
          # 架构迁移元数据（Electron 端读取；文件不存在 = 迁移开关关闭）
          if [ -f releases/migration.json ]; then
            cp releases/migration.json /tmp/gitee-meta/releases/
          fi
          git -C /tmp/gitee-meta config user.name "github-actions[bot]"
          git -C /tmp/gitee-meta config user.email "github-actions[bot]@users.noreply.github.com"
          git -C /tmp/gitee-meta add releases/
          if git -C /tmp/gitee-meta diff --cached --quiet; then
            echo "元数据无变化，跳过推送"
          else
            git -C /tmp/gitee-meta commit -m "chore: update release metadata for $TAG"
            push_ok=0
            for attempt in 1 2 3; do
              if git -C /tmp/gitee-meta push origin master; then
                push_ok=1
                break
              fi
              echo "::warning::Gitee 元数据推送失败（第 $attempt 次），$((attempt * 20))s 后重试"
              sleep $((attempt * 20))
            done
            if [ "$push_ok" != 1 ]; then
              echo "::error::Gitee 元数据推送失败（3 次重试均未成功）"
              exit 1
            fi
            echo "元数据已推送 Gitee releases/"
          fi

          # 3. 创建（或复用）Gitee Release——重跑时复用已有 Release，避免重复失败
          RELEASE_ID=$(curl -s -A "Mozilla/5.0 (compatible; tmd-release-bot/1.0)" \
            "https://gitee.com/api/v5/repos/$GITEE_OWNER/$GITEE_REPO/releases/tags/$TAG" \
            | node -e "let d='';process.stdin.on('data',c=>d+=c);process.stdin.on('end',()=>{try{console.log(JSON.parse(d).id||'')}catch{console.log('')}})")
          if [ -n "$RELEASE_ID" ]; then
            echo "复用已存在的 Gitee Release ID: $RELEASE_ID"
          else
            RELEASE_BODY=$(cat .release-notes.md 2>/dev/null || echo "See GitHub Release for details")
            # 创建请求同样重试：跨国链路偶发超时/空响应（v0.2.1 实测 clone 已挂过）
            for attempt in 1 2 3; do
              RELEASE_RESP=$(curl -s -A "Mozilla/5.0 (compatible; tmd-release-bot/1.0)" -X POST \
                "https://gitee.com/api/v5/repos/$GITEE_OWNER/$GITEE_REPO/releases" \
                -F "access_token=$GITEE_TOKEN" \
                -F "tag_name=$TAG" \
                -F "name=$TAG" \
                --form-string "body=$RELEASE_BODY" \
                -F "target_commitish=master" || true)
              RELEASE_ID=$(echo "$RELEASE_RESP" | node -e "let d='';process.stdin.on('data',c=>d+=c);process.stdin.on('end',()=>{try{console.log(JSON.parse(d).id||'')}catch{console.log('')}})")
              if [ -n "$RELEASE_ID" ]; then
                break
              fi
              echo "::warning::创建 Gitee Release 失败（第 $attempt 次），$((attempt * 20))s 后重试；响应: $RELEASE_RESP"
              sleep $((attempt * 20))
            done
            if [ -z "$RELEASE_ID" ]; then
              echo "::error::创建 Gitee Release 失败，响应: $RELEASE_RESP"
              exit 1
            fi
            echo "Created Gitee Release ID: $RELEASE_ID"
          fi

          # 3.5 配额维护：Gitee 免费仓库的 Release 附件总容量 1GB，每个版本约
          #     15MB（Tauri dmg 7 + exe 6），不清理则从第 60 个版本起上传必失败。
          #     发版前保留最近 KEEP_GITEE_RELEASES 个版本的附件，更早版本的
          #     附件逐个删除——Release 页面与说明保留，旧安装包仍可从 GitHub
          #     Release 下载。删除失败只告警不中断：上传阶段的配额错误才是
          #     最终裁判。
          #     MIGRATION_KEEP_TAG 锚点（v0.2.1）例外：老用户（Electron 0.1.x）
          #     的更新/迁移链路依赖该 Release 的附件（0.1.8 安装包 + 0.2.1
          #     Rust 包），冻结的 latest*.yml 与 migration.json 都指向它，
          #     被清理即断裂——清理循环永远跳过。
          KEEP_GITEE_RELEASES="${KEEP_GITEE_RELEASES:-2}"
          PRUNE_IDS=$(curl -s -A "Mozilla/5.0 (compatible; tmd-release-bot/1.0)" \
            "https://gitee.com/api/v5/repos/$GITEE_OWNER/$GITEE_REPO/releases?per_page=100&access_token=$GITEE_TOKEN" \
            | KEEP="$KEEP_GITEE_RELEASES" CURRENT_ID="$RELEASE_ID" ANCHOR="$MIGRATION_KEEP_TAG" node -e "let d='';process.stdin.on('data',c=>d+=c);process.stdin.on('end',()=>{try{const list=JSON.parse(d);if(!Array.isArray(list))throw new Error('not array');const keep=Number(process.env.KEEP)||2;const sorted=[...list].sort((a,b)=>String(b.created_at).localeCompare(String(a.created_at)));const keepIds=new Set(sorted.slice(0,keep).map(r=>String(r.id)));keepIds.add(String(process.env.CURRENT_ID||''));for(const r of sorted){if(!keepIds.has(String(r.id)) && r.tag_name!==process.env.ANCHOR) console.log(r.id)}}catch(e){console.error('::warning::Gitee Release 列表解析失败，跳过配额清理')}})")
          for rid in $PRUNE_IDS; do
            ATTACH_IDS=$(curl -s -A "Mozilla/5.0 (compatible; tmd-release-bot/1.0)" \
              "https://gitee.com/api/v5/repos/$GITEE_OWNER/$GITEE_REPO/releases/$rid/attach_files?access_token=$GITEE_TOKEN" \
              | node -e "let d='';process.stdin.on('data',c=>d+=c);process.stdin.on('end',()=>{try{const list=JSON.parse(d);if(Array.isArray(list)){for(const a of list) console.log(a.id)}}catch{}})")
            for aid in $ATTACH_IDS; do
              code=$(curl -s -o /dev/null -w "%{http_code}" -X DELETE \
                "https://gitee.com/api/v5/repos/$GITEE_OWNER/$GITEE_REPO/releases/$rid/attach_files/$aid?access_token=$GITEE_TOKEN" || true)
              echo "prune: release $rid attach $aid → HTTP $code"
            done
          done

          # 4. 上传附件——大文件（dmg/exe）并行，Gitee 对海外 IP 的限速若按单连接
          #    计算则吞吐翻倍；小文件串行。
          #    低速保护：15 分钟内平均速度低于 512B/s 才放弃（只拦死连接，
          #    实测约 13KB/s 的正常慢速传输不受影响）
          upload_asset() {
            local f="$1" name size_mb attempt code
            name=$(basename "$f")
            size_mb=$(( $(stat -c%s "$f") / 1024 / 1024 ))
            # 失败重试三次：跨国链路偶发中断（v0.1.1 实测 dmg 整包未落库，
            # 故另有上传后 API 校验兜底，见步骤 5）。v0.1.0 实测 2 次重试
            # 仍会双双失败（dmg 或 exe 各挂一轮），加到 4 次 + 拉长退避。
            # curl 末尾的 `|| true` 不能删：Actions 以 bash -e 执行，超时
            # （exit 28）会让赋值直接终止整个步骤、重试循环形同虚设
            # （v0.2.1 实测：串行通道 app.tar.gz 超时，整步带 28 退出）
            for attempt in 1 2 3 4; do
              echo "Uploading $name (${size_mb}MB) to Gitee Release (attempt $attempt)"
              code=$(curl -s -A "Mozilla/5.0 (compatible; tmd-release-bot/1.0)" \
                --connect-timeout 60 \
                --speed-limit 512 --speed-time 900 \
                -o "/tmp/attach-${name}.json" -w "%{http_code}" -X POST \
                "https://gitee.com/api/v5/repos/$GITEE_OWNER/$GITEE_REPO/releases/$RELEASE_ID/attach_files" \
                -F "access_token=$GITEE_TOKEN" \
                -F "file=@$f" || true)
              code="${code:-000}"
              if [ "$code" -ge 200 ] && [ "$code" -lt 300 ]; then
                echo "$code" > "/tmp/attach-${name}.code"
                return 0
              fi
              echo "::warning::$name 上传失败（HTTP $code），15s 后重试"
              sleep 15
            done
            # 两次都失败：仍落下最终状态码供步骤 4 判定
            echo "$code" > "/tmp/attach-${name}.code"
          }

          # 大文件并行上传：dmg 约 85MB、exe 约 96MB（Electron 与 Tauri 的 NSIS
          # 各一个 exe），均在 Gitee 附件单文件 100MB 上限内（不再产出 mac zip，
          # macOS 改走「下载 dmg 手动安装」；Tauri mac 更新件 app.tar.gz 较小，
          # 与 sig/latest.json 一并走串行通道）
          BIG_FILES=""
          for f in release/*.dmg release/*.exe; do
            [ -f "$f" ] && BIG_FILES="$BIG_FILES $f"
          done
          for f in $BIG_FILES; do
            upload_asset "$f" &
          done
          wait
          for f in release/*.sig release/*.app.tar.gz \
                   release/latest.json; do
            [ -f "$f" ] || continue
            upload_asset "$f"
          done

          ATTACH_FAILED=0
          for f in release/*.dmg release/*.exe release/*.sig \
                   release/*.app.tar.gz release/latest.json; do
            [ -f "$f" ] || continue
            name=$(basename "$f")
            code_file="/tmp/attach-${name}.code"
            # code 文件缺失 = 上传子进程异常结束且未落状态：按失败处理，不静默
            # 跳过（v0.1.1 的 dmg 即因此漏传：step 报成功而附件缺失）
            HTTP_CODE=$(cat "$code_file" 2>/dev/null || echo "000")
            if [ "$HTTP_CODE" -lt 200 ] || [ "$HTTP_CODE" -ge 300 ]; then
              size_mb=$(( $(stat -c%s "$f") / 1024 / 1024 ))
              echo "::error::Gitee 附件上传失败 $name (HTTP $HTTP_CODE): $(cat "/tmp/attach-${name}.json" 2>/dev/null)"
              if [ "$size_mb" -gt 100 ]; then
                echo "::error::$name 为 ${size_mb}MB，超过 Gitee 附件 100MB 上限"
              fi
              ATTACH_FAILED=1
            else
              echo "OK: $name"
            fi
          done
          if [ "$ATTACH_FAILED" -ne 0 ]; then
            echo "::error::有附件未能上传到 Gitee Release（可在本地跑 npm run release:gitee 后手动补传，见文档 §9）"
            exit 1
          fi
          # 5. 上传后校验：以 Gitee 侧附件列表为准逐项核对。HTTP 2xx 不等于
          #    附件已落库——v0.1.1 实测 dmg 上传「成功」但附件不存在，而元数据
          #    已指向它（macOS 下载与更新全 404）。缺失即失败退出：宁可 step
          #    红灯，不可静默发出残缺版本
          #    注意：上传阶段的重试/并发会触发 Gitee API 限流（403 非 JSON），
          #    解析成空列表会把已上传的附件全判缺失（v0.2.1 实测 9 个全在却
          #    报全缺）。列表获取重试 3 次；仍不可用则退回下载端点探测。
          REMOTE_ASSETS=""
          for attempt in 1 2 3; do
            REMOTE_ASSETS=$(curl -s -A "Mozilla/5.0 (compatible; tmd-release-bot/1.0)" \
              "https://gitee.com/api/v5/repos/$GITEE_OWNER/$GITEE_REPO/releases/$RELEASE_ID" \
              | node -e "let d='';process.stdin.on('data',c=>d+=c);process.stdin.on('end',()=>{try{const r=JSON.parse(d);console.log((r.assets||[]).map(a=>a.name).join('\\n'))}catch{console.log('')}})")
            [ -n "$REMOTE_ASSETS" ] && break
            echo "::warning::Gitee 附件列表获取失败（第 $attempt 次，疑似限流），20s 后重试"
            sleep 20
          done
          MISSING=0
          for f in release/*.dmg release/*.exe release/*.sig \
                   release/*.app.tar.gz release/latest.json; do
            [ -f "$f" ] || continue
            name=$(basename "$f")
            present=0
            if printf '%s\\n' "$REMOTE_ASSETS" | grep -qx "$name"; then
              present=1
            else
              # API 列表不可用或未命中：用下载端点核对（200 = 附件已落库）。
              # 端点不走 API 限流，且与用户实际下载路径一致，是最权威的存在性判据
              code=$(curl -s -o /dev/null -w "%{http_code}" -I -L --max-time 30 \
                "https://gitee.com/$GITEE_OWNER/$GITEE_REPO/releases/download/$TAG/$name" || true)
              if [ "$code" = "200" ]; then
                present=1
                echo "::warning::$name 不在 API 列表中，但下载端点 200，按已上传处理"
              fi
            fi
            if [ "$present" != 1 ]; then
              echo "::error::Gitee 附件缺失: $name（API 校验与下载端点均未命中）"
              MISSING=1
            fi
          done
          if [ "$MISSING" -ne 0 ]; then
            echo "::error::Gitee 附件校验失败——本地跑 npm run release:gitee 后手动补传缺失项，见 docs/打包发布.md §9"
            exit 1
          fi
          echo "Gitee 发布完成（安装包 + 元数据，附件经 API 校验齐全）"
